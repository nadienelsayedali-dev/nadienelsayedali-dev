<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little Adventure</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020b13;
}
*{box-sizing:border-box}

.scene{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  min-height:100vh;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

#scene1{
  display:block;
  background-image:url('scene1.png');
  cursor:pointer;
}

#scene2{
  display:none;
  background-image:url('scene2_clean.png');
}

.water{
  position:absolute;
  left:35%;
  right:-4%;
  top:36%;
  bottom:0;
  pointer-events:none;
  opacity:.28;
  mix-blend-mode:screen;
  background:
    repeating-linear-gradient(
      176deg,
      transparent 0 10px,
      rgba(255,255,255,.08) 11px 12px,
      transparent 13px 23px
    );
  animation:waterMove 5s linear infinite;
}
@keyframes waterMove{
  to{background-position:110px 38px;transform:translateX(1.2%)}
}

#blackout{
  position:fixed;
  inset:0;
  z-index:100;
  background:#01070c;
  opacity:0;
  pointer-events:none;
  transition:opacity .65s ease;
}
#blackout.on{opacity:1}

@media(max-width:760px){
  .scene{background-position:center}
}
</style>
</head>
<body>

<section id="scene1" class="scene" aria-label="Opening scene">
  <div class="water"></div>
</section>

<section id="scene2" class="scene" aria-label="Message bottle and approaching boat">
  <div class="water"></div>
</section>

<div id="blackout"></div>

<script>
const scene1 = document.getElementById('scene1');
const scene2 = document.getElementById('scene2');
const blackout = document.getElementById('blackout');
let changing = false;

function openScene2(){
  if(changing) return;
  changing = true;

  // Fade Scene 1 completely to black.
  blackout.classList.add('on');

  setTimeout(() => {
    // Scene 1 is removed from layout entirely.
    scene1.style.display = 'none';

    // Only after Scene 1 is gone, Scene 2 is shown.
    scene2.style.display = 'block';

    // Fade out the black screen to reveal Scene 2.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => blackout.classList.remove('on'));
    });

    changing = false;
  }, 680);
}

scene1.addEventListener('click', openScene2);
scene1.addEventListener('touchend', function(e){
  e.preventDefault();
  openScene2();
}, {passive:false});
</script>

</body>
</html>
