<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020b13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Little Adventure</title>
  <style>
    :root{
      --bg:#020b13;
      --gold:#e8b753;
      --ratio:1672/941;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{
      width:100%;
      height:100%;
      min-height:100dvh;
      overflow:hidden;
      background:var(--bg);
    }

    body{
      position:fixed;
      inset:0;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      touch-action:manipulation;
      overscroll-behavior:none;
    }

    #app{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:var(--bg);
    }

    .scene{
      position:absolute;
      width:min(100vw,calc(100dvh * 1672 / 941));
      height:min(100dvh,calc(100vw * 941 / 1672));
      aspect-ratio:var(--ratio);
      overflow:hidden;
      opacity:0;
      pointer-events:none;
      background:var(--bg);
      transition:opacity .5s ease;
    }

    .scene.active{
      opacity:1;
      pointer-events:auto;
    }

    .art{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:fill;
      display:block;
      pointer-events:none;
      -webkit-user-drag:none;
      transform:translate3d(0,0,0) scale(1);
      transform-origin:38% 55%;
    }

    .hotspot{
      position:absolute;
      z-index:20;
      border:0;
      outline:0;
      margin:0;
      padding:0;
      background:transparent;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    #beginStory{
      left:63.2%;
      top:75%;
      width:21.5%;
      height:10.5%;
    }

    #scene2Continue{
      left:64%;
      top:82%;
      width:25%;
      height:9%;
    }

    /* --- Sailing illusion layers --- */
    #motionShade,
    #speedLines,
    #wakeGlow{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:0;
      z-index:8;
    }

    #motionShade{
      background:
        radial-gradient(circle at 35% 56%, rgba(255,255,255,0) 0 25%, rgba(0,12,25,.05) 46%, rgba(0,6,15,.42) 100%);
    }

    #speedLines{
      background:
        repeating-linear-gradient(
          174deg,
          rgba(255,255,255,0) 0 18px,
          rgba(181,224,255,.16) 19px 21px,
          rgba(255,255,255,0) 22px 44px
        );
      mix-blend-mode:screen;
      transform:translateX(16%);
    }

    #wakeGlow{
      inset:auto 0 0 0;
      height:46%;
      background:
        radial-gradient(ellipse at 37% 83%, rgba(255,211,126,.34) 0, rgba(112,190,255,.13) 22%, rgba(0,0,0,0) 57%);
      filter:blur(5px);
    }

    #scene2.sailing #scene2Art{
      animation:sailPush 2.25s cubic-bezier(.18,.72,.18,1) forwards;
    }

    #scene2.sailing #motionShade{
      animation:shadeIn 2.25s ease forwards;
    }

    #scene2.sailing #speedLines{
      animation:waterRush .62s linear 3;
    }

    #scene2.sailing #wakeGlow{
      animation:wakePulse 2.25s ease forwards;
    }

    #scene2.sailing #scene2Continue{
      pointer-events:none;
      animation:buttonFade .25s ease forwards;
    }

    @keyframes sailPush{
      0%{
        transform:translate3d(0,0,0) scale(1);
        filter:brightness(1);
      }
      18%{
        transform:translate3d(-.3%,.15%,0) scale(1.012);
      }
      43%{
        transform:translate3d(-1.0%,-.15%,0) scale(1.032);
        filter:brightness(1.035);
      }
      70%{
        transform:translate3d(-1.6%,-.35%,0) scale(1.052);
      }
      100%{
        transform:translate3d(-2.2%,-.55%,0) scale(1.072);
        filter:brightness(1.055);
      }
    }

    @keyframes waterRush{
      0%{opacity:0;transform:translateX(17%)}
      22%{opacity:.34}
      100%{opacity:0;transform:translateX(-19%)}
    }

    @keyframes shadeIn{
      0%{opacity:0}
      35%{opacity:.22}
      100%{opacity:.12}
    }

    @keyframes wakePulse{
      0%{opacity:0;transform:scale(.84)}
      30%{opacity:.72}
      68%{opacity:.38}
      100%{opacity:.1;transform:scale(1.18)}
    }

    @keyframes buttonFade{
      to{opacity:0}
    }

    #tapPulse{
      position:absolute;
      z-index:40;
      width:clamp(38px,5.2vw,84px);
      height:clamp(38px,5.2vw,84px);
      border-radius:50%;
      border:2px solid rgba(232,183,83,.96);
      box-shadow:0 0 28px rgba(232,183,83,.82);
      opacity:0;
      transform:translate(-50%,-50%) scale(.55);
      pointer-events:none;
    }

    #tapPulse.play{animation:tapPulse .48s ease forwards}

    @keyframes tapPulse{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
      45%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}
    }

    @media (prefers-reduced-motion:reduce){
      #scene2.sailing #scene2Art{
        animation-duration:.55s;
      }
      #scene2.sailing #speedLines,
      #scene2.sailing #wakeGlow{
        display:none;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="scene1" class="scene active" aria-label="Scene 1">
      <img class="art" src="./scene 1.png" alt="Our Little Adventure" draggable="false">
      <button id="beginStory" class="hotspot" type="button" aria-label="Begin the story"></button>
    </section>

    <section id="scene2" class="scene" aria-label="Scene 2">
      <img id="scene2Art" class="art" src="./scene2.png" alt="Across the Waves" draggable="false">
      <div id="motionShade"></div>
      <div id="speedLines"></div>
      <div id="wakeGlow"></div>
      <button id="scene2Continue" class="hotspot" type="button" aria-label="Sail forward"></button>
    </section>

    <div id="tapPulse" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      const scene1 = document.getElementById("scene1");
      const scene2 = document.getElementById("scene2");
      const beginStory = document.getElementById("beginStory");
      const scene2Continue = document.getElementById("scene2Continue");
      const tapPulse = document.getElementById("tapPulse");

      let sailing = false;

      function pulseAt(event){
        tapPulse.style.left = event.clientX + "px";
        tapPulse.style.top = event.clientY + "px";
        tapPulse.classList.remove("play");
        void tapPulse.offsetWidth;
        tapPulse.classList.add("play");
      }

      function showScene(next){
        document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
        next.classList.add("active");
      }

      beginStory.addEventListener("pointerup", e => {
        e.preventDefault();
        pulseAt(e);
        setTimeout(() => showScene(scene2), 220);
      });

      scene2Continue.addEventListener("pointerup", e => {
        e.preventDefault();
        if(sailing) return;
        sailing = true;
        pulseAt(e);
        scene2.classList.add("sailing");

        /*
          When Scene 3 is approved, connect it here.
          The sailing animation lasts 2250 ms.
        */
        setTimeout(() => {
          document.dispatchEvent(new CustomEvent("scene2SailingComplete"));
        }, 2250);
      });
    })();
  </script>
</body>
</html>
