<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little Adventure</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b13}
*{box-sizing:border-box}
.scene{
 position:fixed;inset:0;width:100vw;height:100dvh;min-height:100vh;
 background-size:cover;background-position:center;background-repeat:no-repeat;
 display:none
}
.scene.active{display:block}
#s1{background-image:url('scene1.png');cursor:pointer}
#s2{background-image:url('scene2_clean.png');cursor:pointer}
#s3{background-image:url('scene3_clean_final.png')}

.water{
 position:absolute;left:28%;right:-5%;top:36%;bottom:0;pointer-events:none;
 opacity:.18;mix-blend-mode:screen;
 background:repeating-linear-gradient(176deg,transparent 0 10px,rgba(255,255,255,.065) 11px 12px,transparent 13px 23px);
 animation:water 5s linear infinite
}
@keyframes water{to{background-position:110px 38px;transform:translateX(1.2%)}}

#blackout{
 position:fixed;inset:0;z-index:100;background:#01070c;opacity:0;
 pointer-events:none;transition:opacity .62s ease
}
#blackout.on{opacity:1}

/* Scene 2 — simple story, no frame */
.story{
 position:absolute;left:6vw;top:50%;transform:translateY(-50%);
 width:min(480px,38vw);color:#fff5dd;font-family:Georgia,serif;
 text-shadow:0 4px 20px rgba(0,0,0,.92);z-index:8
}
.story h2{
 margin:0 0 16px;font-size:clamp(2rem,3.5vw,4.1rem);
 line-height:1.05;font-weight:500
}
.story p{
 margin:0;font-size:clamp(1rem,1.4vw,1.3rem);line-height:1.65
}
.story .gold{color:#efc46d;font-style:italic;margin-top:16px}
.tap{
 position:absolute;left:50%;bottom:3%;transform:translateX(-50%);
 color:#f3cc7b;font:600 12px Georgia,serif;letter-spacing:.18em;
 text-shadow:0 3px 12px #000;opacity:.85;z-index:9
}

/* Scene 3 — minimal UI */
.missionTitle{
 position:absolute;left:4%;top:5%;z-index:8;
 color:#ffd889;font:600 clamp(1.2rem,2.1vw,2.2rem) Georgia,serif;
 text-shadow:0 4px 18px #000
}
.missionHint{
 position:absolute;left:4%;top:11%;z-index:8;
 color:#fff4da;font:italic clamp(.9rem,1.2vw,1.1rem) Georgia,serif;
 text-shadow:0 3px 14px #000
}

/* The player grabs the visible illustrated hand */
#grabHand{
 position:absolute;
 left:29.5%;
 top:62%;
 width:95px;height:95px;border-radius:50%;
 border:2px solid rgba(246,199,105,.95);
 box-shadow:0 0 0 10px rgba(246,199,105,.10),0 0 30px rgba(246,199,105,.8);
 background:rgba(246,199,105,.035);
 z-index:30;cursor:grab;touch-action:none;
 animation:pulse 1.8s ease-in-out infinite
}
@keyframes pulse{50%{box-shadow:0 0 0 15px rgba(246,199,105,.04),0 0 38px rgba(246,199,105,.95)}}

/* Bottle target */
#target{
 position:absolute;left:15%;top:68%;width:155px;height:165px;border-radius:48%;
 border:2px solid rgba(246,199,105,.42);
 box-shadow:0 0 24px rgba(246,199,105,.22);
 z-index:12;pointer-events:none
}

/* Articulated overlay starts at SHOULDER, not chest */
.limb{
 position:fixed;height:38px;border-radius:999px;
 background:linear-gradient(180deg,#b87550,#a76142 58%,#915036);
 box-shadow:inset 0 3px 6px rgba(255,255,255,.15),
            inset 0 -4px 7px rgba(60,20,10,.18),
            0 4px 12px rgba(0,0,0,.25);
 transform-origin:0 50%;display:none;z-index:20;pointer-events:none
}
#elbow{
 position:fixed;width:45px;height:45px;border-radius:50%;
 background:radial-gradient(circle at 38% 32%,#c68058,#9e593b 72%);
 display:none;z-index:22;pointer-events:none
}
#dragHand{
 position:fixed;width:55px;height:55px;border-radius:50%;
 background:radial-gradient(circle at 36% 30%,#cd865d,#ad6746 60%,#925138);
 box-shadow:0 4px 12px rgba(0,0,0,.28);
 display:none;z-index:23;pointer-events:none
}

/* Success: clean, tiny, no giant frame */
#success{
 position:absolute;inset:0;display:none;align-items:center;justify-content:center;
 background:rgba(1,8,18,.48);z-index:40
}
#success.show{display:flex}
.successText{
 text-align:center;color:#fff4d9;font-family:Georgia,serif;
 text-shadow:0 4px 20px #000
}
.successText h2{font-size:clamp(2.4rem,5vw,5rem);margin:0;color:#ffd47c}
.successText p{font-size:clamp(1rem,1.4vw,1.3rem);margin:10px 0 22px}
.successText button{
 border:1px solid #e0b75f;border-radius:999px;padding:13px 28px;
 background:rgba(5,20,34,.78);color:#ffe0a0;font:600 16px Georgia,serif
}

@media(max-width:760px){
 .story{left:5vw;top:20%;transform:none;width:86vw}
 .story h2{font-size:2.3rem}
 .missionTitle{left:4%;top:4%}
 .missionHint{left:4%;top:9%}
 #grabHand{left:28%;top:62%;width:74px;height:74px}
 #target{left:10%;top:68%;width:125px;height:140px}
 .limb{height:30px}
 #elbow{width:36px;height:36px}
 #dragHand{width:46px;height:46px}
}
</style>
</head>
<body>

<section id="s1" class="scene active">
 <div class="water"></div>
</section>

<section id="s2" class="scene">
 <div class="water"></div>
 <div class="story">
   <h2>A message has been wandering through the ocean…</h2>
   <p>Carrying a little secret meant only for you.</p>
   <p class="gold">And tonight, someone is coming to find it.</p>
 </div>
 <div class="tap">TAP TO CONTINUE</div>
</section>

<section id="s3" class="scene">
 <div class="water"></div>
 <div class="missionTitle">Help her reach the message</div>
 <div class="missionHint">Drag her hand toward the bottle.</div>

 <div id="grabHand" aria-label="Drag her hand"></div>
 <div id="target"></div>

 <div id="upperArm" class="limb"></div>
 <div id="foreArm" class="limb"></div>
 <div id="elbow"></div>
 <div id="dragHand"></div>

 <div id="success">
   <div class="successText">
     <h2>You did it!</h2>
     <p>She reached the message.</p>
     <button id="continueBtn">CONTINUE</button>
   </div>
 </div>
</section>

<div id="blackout"></div>

<script>
const scenes=[...document.querySelectorAll('.scene')];
const blackout=document.getElementById('blackout');

function show(id){
 blackout.classList.add('on');
 setTimeout(()=>{
   scenes.forEach(s=>s.classList.remove('active'));
   document.getElementById(id).classList.add('active');
   requestAnimationFrame(()=>requestAnimationFrame(()=>blackout.classList.remove('on')));
 },620);
}

/* Scene 1 -> Scene 2 */
document.getElementById('s1').addEventListener('click',()=>show('s2'));

/* Scene 2 stays FOREVER until the user taps */
document.getElementById('s2').addEventListener('click',()=>show('s3'));

/* Arm game */
const grab=document.getElementById('grabHand');
const target=document.getElementById('target');
const upper=document.getElementById('upperArm');
const fore=document.getElementById('foreArm');
const elbow=document.getElementById('elbow');
const hand=document.getElementById('dragHand');
const success=document.getElementById('success');

let dragging=false;

/* Shoulder anchor in the cropped Scene 3 artwork */
function shoulder(){
 const r=document.getElementById('s3').getBoundingClientRect();
 return {
   x:r.left+r.width*0.535,
   y:r.top+r.height*0.405
 };
}

function setSegment(el,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1;
 el.style.left=x1+'px';
 el.style.top=(y1-el.offsetHeight/2)+'px';
 el.style.width=Math.hypot(dx,dy)+'px';
 el.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';
 el.style.display='block';
}

function pose(x,y){
 const s=shoulder();

 /* Give the arm a visible elbow bend */
 const ex=s.x+(x-s.x)*0.50;
 const ey=s.y+(y-s.y)*0.50-42;

 setSegment(upper,s.x,s.y,ex,ey);
 setSegment(fore,ex,ey,x,y);

 elbow.style.left=(ex-elbow.offsetWidth/2)+'px';
 elbow.style.top=(ey-elbow.offsetHeight/2)+'px';
 elbow.style.display='block';

 hand.style.left=(x-hand.offsetWidth/2)+'px';
 hand.style.top=(y-hand.offsetHeight/2)+'px';
 hand.style.display='block';
}

function hideArm(){
 upper.style.display=fore.style.display=elbow.style.display=hand.style.display='none';
}

function hit(x,y){
 const r=target.getBoundingClientRect();
 return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}

grab.addEventListener('pointerdown',e=>{
 dragging=true;
 grab.setPointerCapture?.(e.pointerId);
 grab.style.opacity='0';
 pose(e.clientX,e.clientY);
});

window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 pose(e.clientX,e.clientY);

 if(hit(e.clientX,e.clientY)){
   dragging=false;
   setTimeout(()=>{
     hideArm();
     grab.style.opacity='1';
     success.classList.add('show');
   },220);
 }
});

window.addEventListener('pointerup',()=>{
 if(!dragging)return;
 dragging=false;
 hideArm();
 grab.style.opacity='1';
});

document.getElementById('continueBtn').addEventListener('click',()=>{
 /* next shore scene will connect here */
});
</script>
</body>
</html>
