<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scene 13 - Locked Secret</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #020814;
      overflow: hidden;
      font-family: Georgia, serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(15,30,55,0.35), rgba(2,8,20,1) 75%);
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    @media (orientation: landscape) {
      img {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }
    }
    @media (orientation: portrait) {
      img {
        width: 100vw;
        height: auto;
        max-height: 100vh;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <img src="scene13.png" alt="Scene 13 - Locked Secret" />
  </div>
</body>
</html>
