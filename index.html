<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Our Little Adventure</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b13}
*{box-sizing:border-box}
#scene{position:relative;width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:url('scene1.png') center/cover no-repeat}
#scene:before{content:"";position:absolute;inset:-2%;background:url('scene1.png') center/cover no-repeat;animation:camera 16s ease-in-out infinite alternate;z-index:0}
@keyframes camera{from{transform:scale(1.01)}to{transform:scale(1.045) translate(-.35%,-.2%)}}
.shimmer{position:absolute;z-index:1;left:42%;right:-5%;top:39%;bottom:19%;background:repeating-linear-gradient(174deg,transparent 0 9px,rgba(255,255,255,.08) 10px 11px,transparent 12px 20px);mix-blend-mode:screen;opacity:.42;animation:water 4s linear infinite;pointer-events:none}
@keyframes water{to{background-position:90px 35px;transform:translateX(1.5%)}}
.spark{position:absolute;z-index:2;width:4px;height:4px;border-radius:50%;background:#ffd37b;box-shadow:0 0 12px #ffc85d;opacity:0;pointer-events:none;animation:rise var(--d) ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(20px) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translate(var(--x),-75px) scale(1.15)}}
.clickzone{position:absolute;z-index:4;left:7%;top:54%;width:29%;height:14%;border:0;background:transparent;cursor:pointer}
.fade{position:absolute;z-index:20;inset:0;background:#020b13;opacity:0;pointer-events:none;transition:opacity 1s ease}
.fade.on{opacity:1}
@media(max-width:700px){#scene,#scene:before{background-position:58% center}.clickzone{left:3%;top:49%;width:52%;height:20%}}
@media(prefers-reduced-motion:reduce){#scene:before,.shimmer,.spark{animation:none}}
</style>
</head>
<body>
<main id="scene" aria-label="Our Little Adventure opening scene">
  <div class="shimmer"></div>
  <button class="clickzone" id="begin" aria-label="Begin the story"></button>
  <div class="fade" id="fade"></div>
</main>
<script>
const scene=document.getElementById('scene');
for(let i=0;i<24;i++){
 const p=document.createElement('i');p.className='spark';
 p.style.left=(55+Math.random()*30)+'%';p.style.top=(65+Math.random()*22)+'%';
 p.style.setProperty('--d',(3+Math.random()*4)+'s');
 p.style.setProperty('--x',(-25+Math.random()*50)+'px');
 p.style.animationDelay=(-Math.random()*6)+'s';scene.appendChild(p);
}
document.getElementById('begin').onclick=()=>{
 const f=document.getElementById('fade');f.classList.add('on');
 setTimeout(()=>f.classList.remove('on'),1000);
};
</script>
</body>
</html>
