<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little Adventure</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b13}
*{box-sizing:border-box}
.scene{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100vh;background-size:cover;background-position:center;background-repeat:no-repeat;display:none}
.scene.active{display:block}
#s1{background-image:url('scene1.png');cursor:pointer}
#s2{background-image:url('scene2_clean.png')}
#s3{background-image:url('scene3_cartoon.png')}
.water{position:absolute;left:30%;right:-4%;top:38%;bottom:0;pointer-events:none;opacity:.22;mix-blend-mode:screen;background:repeating-linear-gradient(176deg,transparent 0 10px,rgba(255,255,255,.075) 11px 12px,transparent 13px 23px);animation:water 5s linear infinite}
@keyframes water{to{background-position:110px 38px;transform:translateX(1.2%)}}
#blackout{position:fixed;inset:0;z-index:100;background:#01070c;opacity:0;pointer-events:none;transition:opacity .6s ease}
#blackout.on{opacity:1}

.missionCard{position:absolute;left:4%;top:8%;max-width:390px;padding:20px 24px;border:1px solid rgba(238,181,83,.7);border-radius:18px;background:rgba(2,12,25,.70);color:#ffe2a3;font-family:Georgia,serif;box-shadow:0 12px 40px #0008;backdrop-filter:blur(5px);z-index:8}
.missionCard b{display:block;font-size:clamp(18px,2.2vw,30px);margin-bottom:7px}
.missionCard span{color:#fff4d8;font-size:clamp(13px,1.3vw,18px)}

#start{position:absolute;left:60%;top:39%;width:90px;height:90px;border-radius:50%;border:2px solid #f4bd5e;box-shadow:0 0 0 10px #f4bd5e22,0 0 25px #f4bd5eaa;background:#f4bd5e0d;z-index:15;cursor:grab;touch-action:none}
#target{position:absolute;left:24%;top:57%;width:150px;height:170px;border-radius:48%;border:2px solid #f4bd5e88;box-shadow:0 0 25px #f4bd5e55;z-index:10;pointer-events:none}
#line{position:fixed;height:5px;border-radius:99px;background:linear-gradient(90deg,#f4bd5e,#fff0bd);box-shadow:0 0 15px #f4bd5e;transform-origin:0 50%;display:none;z-index:14;pointer-events:none}

#success{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(1,8,18,.62);z-index:30}
#success.show{display:flex}
.successBox{text-align:center;color:#ffe4a8;background:rgba(3,15,30,.9);border:1px solid #dba94e;border-radius:24px;padding:28px 38px;box-shadow:0 18px 60px #000a;font-family:Georgia,serif}
.successBox h2{font-size:clamp(28px,4vw,54px);margin:0 0 8px}
.successBox p{color:#fff4dc;font-size:18px}
.successBox button{margin-top:12px;border:1px solid #dba94e;border-radius:999px;padding:13px 28px;background:#091a2a;color:#ffe0a0;font:600 16px Georgia,serif;cursor:pointer}

@media(max-width:760px){
 .missionCard{left:3%;top:5%;max-width:290px;padding:14px 16px}
 #start{left:59%;top:40%;width:70px;height:70px}
 #target{left:18%;top:57%;width:120px;height:145px}
}
</style>
</head>
<body>
<section id="s1" class="scene active"><div class="water"></div></section>
<section id="s2" class="scene"><div class="water"></div></section>
<section id="s3" class="scene">
 <div class="water"></div>
 <div class="missionCard"><b>HELP HER REACH THE MESSAGE</b><span>Drag from her hand and stretch toward the bottle.</span></div>
 <div id="line"></div><div id="start"></div><div id="target"></div>
 <div id="success"><div class="successBox"><h2>You did it!</h2><p>You brought the message closer.</p><button id="continueBtn">CONTINUE</button></div></div>
</section>
<div id="blackout"></div>
<script>
const scenes=[...document.querySelectorAll('.scene')], blackout=document.getElementById('blackout');
function show(id){
 blackout.classList.add('on');
 setTimeout(()=>{scenes.forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');requestAnimationFrame(()=>requestAnimationFrame(()=>blackout.classList.remove('on')))},620)
}
document.getElementById('s1').addEventListener('click',()=>{show('s2');setTimeout(()=>show('s3'),3300)});

const start=document.getElementById('start'), target=document.getElementById('target'), line=document.getElementById('line'), success=document.getElementById('success');
let dragging=false;
function origin(){const r=start.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function draw(x,y){const o=origin(),dx=x-o.x,dy=y-o.y;line.style.left=o.x+'px';line.style.top=(o.y-2)+'px';line.style.width=Math.hypot(dx,dy)+'px';line.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';line.style.display='block'}
function hit(x,y){const r=target.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
start.addEventListener('pointerdown',e=>{dragging=true;start.setPointerCapture?.(e.pointerId);draw(e.clientX,e.clientY)});
window.addEventListener('pointermove',e=>{if(!dragging)return;draw(e.clientX,e.clientY);if(hit(e.clientX,e.clientY)){dragging=false;line.style.display='none';success.classList.add('show')}});
window.addEventListener('pointerup',()=>{dragging=false;line.style.display='none'});
document.getElementById('continueBtn').addEventListener('click',()=>{/* next shore scene goes here */});
</script>
</body>
</html>
