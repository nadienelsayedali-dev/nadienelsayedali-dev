<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020b13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Little Adventure</title>
  <!-- navigation-fix-v2: scene9 and scene12 full-scene tap -->

  <style>
    :root{
      --bg:#020b13;
      --ratio:1672/941;
      --gold:#e8b753;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      width:100%;
      height:100%;
      min-height:100dvh;
      overflow:hidden;
      background:var(--bg);
    }

    body{
      position:fixed;
      inset:0;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      touch-action:none;
      overscroll-behavior:none;
    }

    #app{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:var(--bg);
    }

    .scene{
      position:absolute;
      width:min(100vw,calc(100dvh * 1672 / 941));
      height:min(100dvh,calc(100vw * 941 / 1672));
      aspect-ratio:var(--ratio);
      overflow:hidden;
      opacity:0;
      pointer-events:none;
      background:var(--bg);
      transition:opacity .62s ease;
    }

    .scene.active{
      opacity:1;
      pointer-events:auto;
    }

    .scene img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:fill;
      pointer-events:none;
      -webkit-user-drag:none;
    }

    .hotspot{
      position:absolute;
      z-index:30;
      border:0;
      outline:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }

    /* Scene 1 */
    #beginStory{
      left:63.2%;
      top:75%;
      width:21.5%;
      height:10.5%;
    }

    /* Scene 2 */
    #scene2Continue{
      left:61%;
      top:79%;
      width:30%;
      height:11%;
    }

    /* Scene 5 line-drag layer */
    #reachCanvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:20;
      pointer-events:none;
    }

    /*
      Invisible start area around her reaching hand.
      The bottle itself never moves.
    */
    #handDragStart{
      left:47%;
      top:61%;
      width:13%;
      height:17%;
      z-index:40;
      cursor:grab;
    }

    #handDragStart.dragging{
      cursor:grabbing;
    }

    /* Success scene: CONTINUE button */
    #scene6Continue{
      left:67.5%;
      top:72.5%;
      width:21.5%;
      height:11%;
      z-index:40;
    }

    /* Scene 7: CONTINUE button */
    #scene7Continue{
      left:67%;
      top:73%;
      width:22%;
      height:11%;
      z-index:40;
    }

    #missionHint{
      position:absolute;
      left:50%;
      bottom:2.7%;
      transform:translateX(-50%);
      z-index:35;
      padding:.42rem .9rem;
      border:1px solid rgba(232,183,83,.4);
      border-radius:999px;
      background:rgba(2,11,19,.42);
      color:#efd18c;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(12px,1.25vw,21px);
      letter-spacing:.045em;
      text-shadow:0 2px 8px #000;
      opacity:0;
      pointer-events:none;
      transition:opacity .3s ease;
      backdrop-filter:blur(3px);
    }

    #scene5.active #missionHint{
      opacity:.94;
    }

    #missionHint.done{
      opacity:0 !important;
    }

    #tapPulse{
      position:fixed;
      z-index:80;
      width:72px;
      height:72px;
      border-radius:50%;
      border:2px solid rgba(232,183,83,.96);
      box-shadow:0 0 28px rgba(232,183,83,.82);
      opacity:0;
      transform:translate(-50%,-50%) scale(.55);
      pointer-events:none;
    }

    #tapPulse.play{
      animation:tapPulse .45s ease forwards;
    }

    @keyframes tapPulse{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
      45%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}
    }
  
    /* ===== Scene 8: Grab -> Lift -> Drop ===== */
    #scene8{
      background:#020b13;
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }

    .scene8State{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:fill;
      opacity:0;
      transform:scale(1.003);
      transition:opacity .38s ease, transform .38s ease;
      pointer-events:none;
      -webkit-user-drag:none;
    }

    .scene8State.active8{
      opacity:1;
      transform:scale(1);
    }

    #scene8Gesture{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:55;
      pointer-events:none;
    }

    #scene8TapRock{
      position:absolute;
      left:68%;
      top:65%;
      width:28%;
      height:31%;
      z-index:65;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    #scene8Hint{
      position:absolute;
      left:50%;
      bottom:2.7%;
      transform:translateX(-50%);
      z-index:70;
      padding:.43rem .95rem;
      border:1px solid rgba(232,183,83,.42);
      border-radius:999px;
      background:rgba(2,11,19,.46);
      color:#efd18b;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(12px,1.2vw,20px);
      letter-spacing:.04em;
      text-shadow:0 2px 8px #000;
      backdrop-filter:blur(3px);
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease;
      white-space:nowrap;
    }

    #scene8.active #scene8Hint{
      opacity:.95;
    }

  
    /* ===== Scene 9: broken-bottle reveal ===== */
    #scene9Continue{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:40;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

  
    /* ===== Scene 10: message letter ===== */
    #scene10Continue{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:40;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

  
    /* ===== Scene 11: The First Clue ===== */
    #scene11Continue{
      position:absolute;
      left:59%;
      top:80%;
      width:29%;
      height:10%;
      z-index:45;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

  
    /* ===== Scene 12: hidden chest discovery ===== */
    #scene12Continue{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:45;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    /* ===== Scene 13: locked secret ===== */
    #scene13Lock{
      position:absolute;
      left:56%;
      top:61%;
      width:18%;
      height:25%;
      z-index:50;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }


    /* ===== Scene 14: The Key Thief — 4-step crab interaction ===== */
    #scene14{
      background:#020b13;
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }

    .scene14State{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:fill;
      opacity:0;
      transform:scale(1.003);
      transition:opacity .42s ease, transform .42s ease;
      pointer-events:none;
      -webkit-user-drag:none;
    }

    .scene14State.active14{
      opacity:1;
      transform:scale(1);
    }

    #scene14Action{
      position:absolute;
      z-index:70;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    /* Tap targets are moved with each image-state so the visible crab/key is what is tapped. */
    #scene14Action.phase0{ left:40%; top:57%; width:29%; height:31%; }
    #scene14Action.phase1{ left:43%; top:60%; width:28%; height:30%; }
    #scene14Action.phase2{ left:37%; top:72%; width:25%; height:17%; }
    #scene14Action.phase3{ left:35%; top:87%; width:30%; height:10%; }

    #scene14Spark{
      position:absolute;
      z-index:62;
      width:88px;
      height:88px;
      border-radius:50%;
      border:2px solid rgba(242,193,91,.85);
      box-shadow:0 0 30px rgba(242,193,91,.7), inset 0 0 20px rgba(242,193,91,.28);
      opacity:0;
      pointer-events:none;
      transform:translate(-50%,-50%) scale(.35);
    }

    #scene14Spark.play{ animation:scene14Spark .5s ease forwards; }

    @keyframes scene14Spark{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
      42%{opacity:1;transform:translate(-50%,-50%) scale(.95)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}
    }

    /* =========================================================
       iPHONE BEST-FIT LAYOUT
       Full artwork visible, maximum height, soft side fill.
       ========================================================= */

    #rotatePhone{
      display:none;
      position:fixed;
      inset:0;
      z-index:10000;
      align-items:center;
      justify-content:center;
      padding:28px;
      background:#020b13;
      color:#efc978;
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
    }

    .rotateCard{
      max-width:420px;
      padding:26px 24px;
      border:1px solid rgba(239,201,120,.38);
      border-radius:22px;
      background:rgba(7,20,32,.84);
      box-shadow:0 0 35px rgba(0,0,0,.35);
    }

    .rotateIcon{
      font-size:52px;
      line-height:1;
      margin-bottom:12px;
    }

    .rotateTitle{
      font-size:24px;
      letter-spacing:.08em;
      margin-bottom:8px;
    }

    .rotateText{
      color:#f5e4ba;
      font-size:16px;
      line-height:1.45;
    }

    #sceneBackdrop{
      position:absolute;
      z-index:0;
      inset:-8%;
      width:116%;
      height:116%;
      object-fit:cover;
      object-position:center;
      filter:blur(28px) brightness(.34) saturate(1.08);
      transform:scale(1.06);
      opacity:1;
      pointer-events:none;
      transition:opacity .35s ease;
    }

    #app::after{
      content:"";
      position:absolute;
      z-index:1;
      inset:0;
      pointer-events:none;
      background:rgba(2,11,19,.12);
    }

    @media (orientation:portrait){
      #rotatePhone{display:flex !important;}
      #app{visibility:hidden !important;}
    }

    @media (orientation:landscape){
      html,body{
        width:100% !important;
        height:100% !important;
        min-height:0 !important;
        margin:0 !important;
        padding:0 !important;
        overflow:hidden !important;
        background:#020b13 !important;
      }

      body{
        position:fixed !important;
        inset:0 !important;
      }

      #rotatePhone{display:none !important;}

      #app{
        visibility:visible !important;
        position:fixed !important;
        left:0 !important;
        top:0 !important;
        width:var(--phone-vw, 100vw) !important;
        height:var(--phone-vh, 100vh) !important;
        min-width:0 !important;
        min-height:0 !important;
        padding:0 !important;
        margin:0 !important;
        overflow:hidden !important;
        display:flex !important;
        align-items:center !important;
        justify-content:center !important;
        background:#020b13 !important;
      }

      .scene{
        position:absolute !important;
        left:50% !important;
        top:50% !important;
        width:var(--fit-w) !important;
        height:var(--fit-h) !important;
        aspect-ratio:1672 / 941 !important;
        transform:translate(-50%,-50%) !important;
        margin:0 !important;
        max-width:none !important;
        max-height:none !important;
        z-index:5 !important;
        box-shadow:0 0 34px rgba(0,0,0,.42);
      }

      .scene img,
      .scene8State{
        position:absolute !important;
        inset:0 !important;
        width:100% !important;
        height:100% !important;
        object-fit:fill !important;
        object-position:center !important;
      }

      #scene5Canvas,
      #reachCanvas,
      #scene8Gesture{
        position:absolute !important;
        inset:0 !important;
        width:100% !important;
        height:100% !important;
      }
    }

  
    /* ===== Gentle iPhone landscape zoom =====
       1.08 = slightly wider/larger, while keeping the important content visible.
       The whole scene (including hotspots/canvases) scales together.
    */
    @media (orientation:landscape){
      .scene{
        transform:translate(-50%,-50%) scale(1.08) !important;
        transform-origin:center center !important;
      }
    }

  

    /* ===== Scene 14 video + Scene 15 hybrid mission ===== */
    #scene14Video,
    #scene15Intro,
    #scene15Reaction,
    #scene15Success,
    #scene15ChestOpen{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:fill;
      display:block;
      background:#020b13;
      z-index:80;
      pointer-events:none;
    }

    /* Old Scene 14 tap-state control remains in the DOM only for compatibility. */
    #scene14Action{ pointer-events:none !important; opacity:0 !important; }
    .scene14State{ opacity:0 !important; }

    #scene15{
      background:#020b13;
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }

    #scene15BackdropSource{ display:none; }

    #scene15Reaction,
    #scene15Success,
    #scene15ChestOpen{ display:none; }

    #scene15Choices{
      position:absolute;
      left:50%;
      bottom:4.2%;
      transform:translateX(-50%);
      width:min(78%, 1080px);
      display:none;
      grid-template-columns:repeat(3,1fr);
      gap:clamp(8px,1.2vw,18px);
      z-index:105;
    }

    .scene15Choice{
      min-height:clamp(54px,8vh,86px);
      border:1px solid rgba(239,201,120,.62);
      border-radius:18px;
      background:linear-gradient(180deg,rgba(6,15,26,.76),rgba(2,8,15,.88));
      color:#f1d693;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(14px,1.55vw,24px);
      letter-spacing:.08em;
      text-transform:uppercase;
      text-shadow:0 2px 8px #000;
      box-shadow:0 10px 30px rgba(0,0,0,.28), inset 0 0 24px rgba(235,182,78,.05);
      backdrop-filter:blur(7px);
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    .scene15Choice:active{
      transform:scale(.98);
      box-shadow:0 0 24px rgba(234,187,89,.28);
    }

    #scene15ChoiceHint,
    #scene15DragHint{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      z-index:106;
      padding:.45rem 1rem;
      border:1px solid rgba(239,201,120,.45);
      border-radius:999px;
      background:rgba(2,11,19,.58);
      color:#efd18b;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(12px,1.2vw,20px);
      letter-spacing:.05em;
      text-shadow:0 2px 8px #000;
      backdrop-filter:blur(4px);
      pointer-events:none;
      white-space:nowrap;
      display:none;
    }

    #scene15ChoiceHint{ bottom:15.4%; }
    #scene15DragHint{ bottom:2.8%; }

    #scene15KeyDragImage{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:fill;
      display:none;
      z-index:82;
      pointer-events:none;
    }

    #scene15KeyCanvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:100;
      display:none;
      pointer-events:none;
    }

    #scene15KeyStart{
      position:absolute;
      left:35%;
      top:72%;
      width:23%;
      height:20%;
      z-index:108;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      display:none;
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }


    /* ===== Fix v16: clear lock beat + obvious Scene 15 reactions ===== */
    #scene13FailGlow{
      position:absolute;
      left:64.7%;
      top:63.7%;
      width:13%;
      aspect-ratio:1;
      border-radius:50%;
      z-index:95;
      pointer-events:none;
      opacity:0;
      border:2px solid rgba(246,202,102,.9);
      box-shadow:0 0 10px rgba(239,188,77,.85),0 0 34px rgba(239,188,77,.6),inset 0 0 24px rgba(239,188,77,.25);
    }
    #scene13FailGlow.play{
      animation:scene13FailPulse .95s ease forwards;
    }
    @keyframes scene13FailPulse{
      0%{opacity:0;transform:scale(.65)}
      35%{opacity:1;transform:scale(1.02)}
      60%{opacity:.9;transform:scale(.94)}
      100%{opacity:0;transform:scale(1.3)}
    }

    #scene15ReactionFeedback{
      position:absolute;
      left:50%;
      top:15%;
      transform:translateX(-50%);
      width:min(72%,900px);
      z-index:125;
      text-align:center;
      pointer-events:none;
      opacity:0;
      transition:opacity .25s ease;
      color:#f5dda1;
      font-family:Georgia,"Times New Roman",serif;
      text-shadow:0 3px 16px #000,0 0 24px rgba(0,0,0,.85);
    }
    #scene15ReactionFeedback.show{opacity:1;}
    #scene15ReactionFeedback .reactionTitle{
      font-size:clamp(26px,4vw,58px);
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#e9b95d;
      margin-bottom:.25em;
    }
    #scene15ReactionFeedback .reactionText{
      font-size:clamp(16px,2vw,28px);
      line-height:1.25;
    }
    #scene15Reaction.feedback-fruit{animation:reactionFruit 2.5s ease both;}
    #scene15Reaction.feedback-pearl{animation:reactionPearl 2.7s ease both;}
    #scene15Reaction.feedback-shell{animation:reactionShell 3.2s ease both;}
    @keyframes reactionFruit{
      0%{transform:translateX(0) scale(1);filter:none}
      35%{transform:translateX(-1.2%) scale(1.01);filter:saturate(.92)}
      55%{transform:translateX(1.1%) scale(1.005)}
      75%{transform:translateX(-.6%) scale(1)}
      100%{transform:translateX(0) scale(1)}
    }
    @keyframes reactionPearl{
      0%{transform:scale(1);filter:brightness(1)}
      45%{transform:scale(1.018);filter:brightness(1.12)}
      100%{transform:scale(1);filter:brightness(1)}
    }
    @keyframes reactionShell{
      0%{transform:scale(1);filter:brightness(1)}
      55%{transform:scale(1.025);filter:brightness(1.18) saturate(1.08)}
      100%{transform:scale(1);filter:brightness(1.06)}
    }

    #scene16 img{ object-fit:fill; }

  
    /* ===== Rock Paper Scissors mission ===== */
    #scene15Reveal, #scene15RpsChoice, #scene15PaperLose, #scene15ScissorsTie, #scene15RockWin{
      position:absolute; inset:0; width:100%; height:100%; object-fit:fill; display:none; z-index:35;
    }
    #scene15RpsButtons{position:absolute; inset:0; z-index:50; display:none; pointer-events:none;}
    .rpsChoice{position:absolute; bottom:4.5%; height:17%; background:transparent; border:0; border-radius:22px; pointer-events:auto; -webkit-tap-highlight-color:transparent;}
    .rpsChoice.rock{left:10.5%; width:25.5%;}
    .rpsChoice.paper{left:37.5%; width:25.5%;}
    .rpsChoice.scissors{left:64.5%; width:25.5%;}
    .rpsChoice:active{background:rgba(236,190,95,.10); box-shadow:0 0 28px rgba(236,190,95,.25) inset;}
    #scene15RpsTapHint{position:absolute; left:50%; bottom:1.6%; transform:translateX(-50%); z-index:52; display:none; color:#f0d8a8; font:600 15px Georgia,serif; text-shadow:0 2px 8px #000; pointer-events:none;}
    #scene15RevealTap{position:absolute; inset:0; z-index:48; display:none; background:transparent; border:0;}
    .rpsResultPulse{animation:rpsResultPulse .5s ease-out both;}
    @keyframes rpsResultPulse{from{filter:brightness(.75);transform:scale(.985)}to{filter:brightness(1);transform:scale(1)}}

  </style>
</head>

<body>
  <div id="rotatePhone" aria-hidden="true">
    <div class="rotateCard">
      <div class="rotateIcon">↻</div>
      <div class="rotateTitle">TURN YOUR PHONE</div>
      <div class="rotateText">Rotate to landscape to continue the adventure.</div>
    </div>
  </div>
  <main id="app">
    <img id="sceneBackdrop" aria-hidden="true" alt="">

    <section id="scene1" class="scene active">
      <img src="./scene 1.png" alt="Our Little Adventure">
      <button id="beginStory" class="hotspot" aria-label="Begin the story"></button>
    </section>

    <section id="scene2" class="scene">
      <img src="./scene2.png" alt="Across the Waves">
      <button id="scene2Continue" class="hotspot" aria-label="Sail forward"></button>
    </section>

    <section id="scene3" class="scene">
      <img src="./scene3.png" alt="Boat sailing farther into the sea">
    </section>

    <section id="scene4" class="scene">
      <img src="./scene4.png" alt="A bottle appears ahead of the boat">
    </section>

    <section id="scene5" class="scene">
      <img src="./scene5.png" alt="Your Mission">

      <div id="scene15RpsButtons" aria-label="Choose rock paper or scissors">
        <button class="rpsChoice rock" data-rps="rock" type="button" aria-label="Rock"></button>
        <button class="rpsChoice paper" data-rps="paper" type="button" aria-label="Paper"></button>
        <button class="rpsChoice scissors" data-rps="scissors" type="button" aria-label="Scissors"></button>
      </div>
      <div id="scene15RpsTapHint">Tap ROCK, PAPER or SCISSORS</div>

      <video id="scene15Reaction" muted playsinline preload="auto"></video>
      <video id="scene15Success" src="./scene15_success.mp4?v=15" muted playsinline preload="auto"></video>
      <img id="scene15KeyDragImage" src="./scene15_keydrag.png?v=15" alt="Drag the key to the lock">
      <canvas id="scene15KeyCanvas" width="1672" height="941"></canvas>
      <button id="scene15KeyStart" type="button" aria-label="Drag the key to the lock"></button>
      <div id="scene15ChoiceHint">Choose something the little key keeper might like</div>
      <div id="scene15ReactionFeedback" aria-live="polite">
        <div class="reactionTitle"></div>
        <div class="reactionText"></div>
      </div>
      <div id="scene15Choices" aria-label="Choose a gift for the crab">
        <button class="scene15Choice" data-choice="pearl" type="button">Pearl</button>
        <button class="scene15Choice" data-choice="fruit" type="button">Fruit</button>
        <button class="scene15Choice" data-choice="shell" type="button">Beautiful Shell</button>
      </div>
      <div id="scene15DragHint">DRAG THE KEY TO THE LOCK</div>
      <video id="scene15ChestOpen" src="./scene15_chest_open.mp4?v=15" muted playsinline preload="auto"></video>
    </section>

    <section id="scene16" class="scene">
      <img src="./scene16_alchemy.png?v=16" alt="The Alchemy Room">
    </section>

    <div id="tapPulse" aria-hidden="true"></div>
  </main>

  <script>
  (() => {
    const W = 1672;
    const H = 941;

    const scenes = [...document.querySelectorAll(".scene")];
    const sceneBackdrop = document.getElementById("sceneBackdrop");
    const scene1 = document.getElementById("scene1");
    const scene2 = document.getElementById("scene2");
    const scene3 = document.getElementById("scene3");
    const scene4 = document.getElementById("scene4");
    const scene5 = document.getElementById("scene5");
    const scene6 = document.getElementById("scene6");
    const scene7 = document.getElementById("scene7");
    const scene8 = document.getElementById("scene8");
    const scene9 = document.getElementById("scene9");
    const scene10 = document.getElementById("scene10");
    const scene11 = document.getElementById("scene11");
    const scene12 = document.getElementById("scene12");
    const scene13 = document.getElementById("scene13");
    const scene14 = document.getElementById("scene14");

    const beginStory = document.getElementById("beginStory");
    const scene2Continue = document.getElementById("scene2Continue");
    const tapPulse = document.getElementById("tapPulse");

    const reachCanvas = document.getElementById("reachCanvas");
    const ctx = reachCanvas.getContext("2d");
    const handDragStart = document.getElementById("handDragStart");
    const missionHint = document.getElementById("missionHint");
    const scene6Continue = document.getElementById("scene6Continue");
    const scene7Continue = document.getElementById("scene7Continue");
    const scene8State1 = document.getElementById("scene8State1");
    const scene8State2 = document.getElementById("scene8State2");
    const scene8State3 = document.getElementById("scene8State3");
    const scene8Gesture = document.getElementById("scene8Gesture");
    const scene8Ctx = scene8Gesture.getContext("2d");
    const scene8TapRock = document.getElementById("scene8TapRock");
    const scene8Hint = document.getElementById("scene8Hint");
    const scene9Continue = document.getElementById("scene9Continue");
    const scene10Continue = document.getElementById("scene10Continue");
    const scene11Continue = document.getElementById("scene11Continue");
    const scene12Continue = document.getElementById("scene12Continue");
    const scene13Lock = document.getElementById("scene13Lock");
    const scene14State1 = document.getElementById("scene14State1");
    const scene14State2 = document.getElementById("scene14State2");
    const scene14State3 = document.getElementById("scene14State3");
    const scene14State4 = document.getElementById("scene14State4");
    const scene14Action = document.getElementById("scene14Action");
    const scene14Spark = document.getElementById("scene14Spark");
    const scene14Video = document.getElementById("scene14Video");
    const scene15 = document.getElementById("scene15");
    const scene15Intro = document.getElementById("scene15Intro");
    const scene15Reaction = document.getElementById("scene15Reaction");
    const scene15Success = document.getElementById("scene15Success");
    const scene15Choices = document.getElementById("scene15Choices");
    const scene15ChoiceHint = document.getElementById("scene15ChoiceHint");
    const scene15ReactionFeedback = document.getElementById("scene15ReactionFeedback");
    const scene15ReactionTitle = scene15ReactionFeedback.querySelector(".reactionTitle");
    const scene15ReactionText = scene15ReactionFeedback.querySelector(".reactionText");
    const scene13FailGlow = document.getElementById("scene13FailGlow");
    const scene15KeyDragImage = document.getElementById("scene15KeyDragImage");
    const scene15KeyCanvas = document.getElementById("scene15KeyCanvas");
    const scene15KeyCtx = scene15KeyCanvas.getContext("2d");
    const scene15KeyStart = document.getElementById("scene15KeyStart");
    const scene15DragHint = document.getElementById("scene15DragHint");
    const scene15ChestOpen = document.getElementById("scene15ChestOpen");
    const scene16 = document.getElementById("scene16");

    /*
      Locked coordinates in the 1672 x 941 artwork.
      Nothing in the PNG is moved.
    */
    const hand = { x: 914, y: 657 };
    const bottle = { x: 1005, y: 757 };
    const bottleRadius = 105;

    let dragging = false;
    let complete = false;
    let current = { x: hand.x, y: hand.y };

    function updateSceneBackdrop(scene){
      if(!sceneBackdrop || !scene) return;
      const img = scene.querySelector(".scene14State.active14, .scene8State.active8, img");
      if(!img) return;

      const src = img.currentSrc || img.getAttribute("src") || "";
      if(!src) return;

      sceneBackdrop.src = src;
    }

    function showScene(next){
      scenes.forEach(s => s.classList.remove("active"));
      next.classList.add("active");
      updateSceneBackdrop(next);
    }

    function pulseAt(e){
      if(typeof e.clientX !== "number") return;
      tapPulse.style.left = e.clientX + "px";
      tapPulse.style.top = e.clientY + "px";
      tapPulse.classList.remove("play");
      void tapPulse.offsetWidth;
      tapPulse.classList.add("play");
    }

    function pointInArtwork(e){
      const r = reachCanvas.getBoundingClientRect();
      return {
        x:(e.clientX-r.left) * W/r.width,
        y:(e.clientY-r.top) * H/r.height
      };
    }

    function clearLine(){
      ctx.clearRect(0,0,W,H);
    }

    function drawLine(endX,endY,success=false){
      clearLine();

      ctx.save();
      ctx.lineCap="round";
      ctx.lineJoin="round";

      /* soft glow */
      ctx.shadowColor = success
        ? "rgba(255,220,130,.98)"
        : "rgba(232,183,83,.9)";
      ctx.shadowBlur = success ? 28 : 17;

      ctx.strokeStyle = success
        ? "rgba(255,222,146,.98)"
        : "rgba(232,183,83,.92)";

      ctx.lineWidth = success ? 5 : 4;
      ctx.setLineDash(success ? [] : [12,10]);

      ctx.beginPath();
      ctx.moveTo(hand.x,hand.y);

      /*
        Slight curve makes the reach feel more elegant
        than a rigid straight line.
      */
      const mx=(hand.x+endX)/2;
      const my=(hand.y+endY)/2 - 24;
      ctx.quadraticCurveTo(mx,my,endX,endY);
      ctx.stroke();

      /* small glowing end point */
      ctx.setLineDash([]);
      ctx.fillStyle = success
        ? "rgba(255,229,166,.98)"
        : "rgba(239,196,101,.95)";
      ctx.beginPath();
      ctx.arc(endX,endY,success ? 10 : 7,0,Math.PI*2);
      ctx.fill();

      ctx.restore();
    }

    function startReach(e){
      if(complete) return;

      e.preventDefault();
      dragging=true;
      handDragStart.classList.add("dragging");

      current = pointInArtwork(e);
      drawLine(current.x,current.y);

      try{
        handDragStart.setPointerCapture(e.pointerId);
      }catch(_){}
    }

    function moveReach(e){
      if(!dragging || complete) return;

      e.preventDefault();
      current=pointInArtwork(e);
      drawLine(current.x,current.y);

      /*
        Complete immediately when the drawn line reaches the bottle.
      */
      const d=Math.hypot(current.x-bottle.x,current.y-bottle.y);

      if(d <= bottleRadius){
        completeMission();
      }
    }

    function endReach(e){
      if(!dragging || complete) return;

      e.preventDefault();
      dragging=false;
      handDragStart.classList.remove("dragging");

      const p=pointInArtwork(e);
      const d=Math.hypot(p.x-bottle.x,p.y-bottle.y);

      if(d <= bottleRadius){
        completeMission();
      }else{
        /*
          Missed the bottle:
          line disappears and user can try again.
        */
        clearLine();
      }
    }

    function completeMission(){
      if(complete) return;

      complete=true;
      dragging=false;
      handDragStart.classList.remove("dragging");
      handDragStart.style.pointerEvents="none";
      missionHint.classList.add("done");

      /*
        Snap ONLY THE LINE to the bottle.
        The bottle PNG stays 100% unchanged.
      */
      drawLine(bottle.x,bottle.y,true);

      document.dispatchEvent(
        new CustomEvent("bottleMissionComplete")
      );

      /* Show the locked MISSION COMPLETE scene after a short success beat */
      setTimeout(() => {
        showScene(scene6);
      }, 700);
    }

    handDragStart.addEventListener("pointerdown",startReach);
    handDragStart.addEventListener("pointermove",moveReach);
    handDragStart.addEventListener("pointerup",endReach);
    handDragStart.addEventListener("pointercancel",endReach);

    /*
      Existing story flow.
      Scene 3 = 3 seconds.
      Scene 4 = 3 seconds.
    */
    beginStory.addEventListener("pointerup",e=>{
      e.preventDefault();
      pulseAt(e);
      setTimeout(()=>showScene(scene2),220);
    });

    scene2Continue.addEventListener("pointerup",e=>{
      e.preventDefault();
      pulseAt(e);

      setTimeout(()=>{
        showScene(scene3);

        setTimeout(()=>{
          showScene(scene4);

          setTimeout(()=>{
            showScene(scene5);
          },3000);

        },3000);

      },260);
    });

    /* Scene 6 -> Scene 7 */
    scene6Continue.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      setTimeout(() => showScene(scene7), 260);
    });

    /* Scene 7 -> Scene 8 */
    scene7Continue.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      setTimeout(() => {
        showScene(scene8);
        resetScene8();
      }, 260);
    });


    /* ===== Scene 8 interaction =====
       1) Tap rock -> show grabbed state.
       2) Drag upward -> draw gold line, then show lifted state.
       3) Drag downward toward bottle -> draw gold line and complete.
    */

    let scene8Phase = 0;
    let scene8Dragging = false;
    let scene8PointerId = null;
    let scene8Start = null;

    const ART_W = 1672;
    const ART_H = 941;

    /* Coordinates in the locked artwork */
    const grabbedRock = { x:1040, y:770 };   // Scene 8.2 rock
    const liftedRock  = { x:930,  y:175 };   // Scene 8.3 raised rock
    const bottleTarget = { x:700, y:835 };   // bottle in Scene 8.3

    function setScene8State(n){
      scene8State1.classList.toggle("active8", n === 1);
      scene8State2.classList.toggle("active8", n === 2);
      scene8State3.classList.toggle("active8", n === 3);
    }

    function resetScene8(){
      scene8Phase = 0;
      scene8Dragging = false;
      scene8PointerId = null;
      scene8Start = null;
      setScene8State(1);
      scene8TapRock.style.display = "block";
      scene8Hint.textContent = "Tap the glowing rock";
      scene8Ctx.clearRect(0,0,ART_W,ART_H);
    }

    ["./scene8_1.png?v=8","./scene8_2.png?v=8","./scene8_3.png?v=8"].forEach(src => {
      const img = new Image();
      img.src = src;
    });

    function artPoint(clientX, clientY){
      const r = scene8Gesture.getBoundingClientRect();
      return {
        x:(clientX-r.left) * ART_W/r.width,
        y:(clientY-r.top) * ART_H/r.height
      };
    }

    function clearScene8Line(){
      scene8Ctx.clearRect(0,0,ART_W,ART_H);
    }

    function drawScene8Line(from, to){
      clearScene8Line();

      scene8Ctx.save();
      scene8Ctx.lineCap = "round";
      scene8Ctx.lineJoin = "round";
      scene8Ctx.strokeStyle = "rgba(236,184,77,.96)";
      scene8Ctx.lineWidth = 4;
      scene8Ctx.setLineDash([13,10]);
      scene8Ctx.shadowColor = "rgba(236,184,77,.95)";
      scene8Ctx.shadowBlur = 16;

      scene8Ctx.beginPath();
      scene8Ctx.moveTo(from.x, from.y);
      scene8Ctx.lineTo(to.x, to.y);
      scene8Ctx.stroke();

      scene8Ctx.setLineDash([]);
      scene8Ctx.fillStyle = "rgba(255,218,130,.98)";
      scene8Ctx.beginPath();
      scene8Ctx.arc(to.x,to.y,8,0,Math.PI*2);
      scene8Ctx.fill();
      scene8Ctx.restore();
    }

    /* STEP 1: tap rock -> grabbed image */
    scene8TapRock.addEventListener("pointerup", e => {
      e.preventDefault();
      if(scene8Phase !== 0) return;

      scene8Phase = 1;
      setScene8State(2);
      scene8TapRock.style.display = "none";
      scene8Hint.textContent = "Drag upward to lift the rock";
    });

    /*
      STEP 2 and STEP 3 use gestures directly on the scene.
    */
    scene8.addEventListener("pointerdown", e => {
      if(scene8Phase !== 1 && scene8Phase !== 2) return;

      e.preventDefault();
      const p = artPoint(e.clientX,e.clientY);

      if(scene8Phase === 1){
        /* Begin upward drag near the grabbed rock */
        if(Math.hypot(p.x-grabbedRock.x,p.y-grabbedRock.y) > 240) return;
      } else {
        /* Begin downward drag near the raised rock */
        if(Math.hypot(p.x-liftedRock.x,p.y-liftedRock.y) > 260) return;
      }

      scene8Dragging = true;
      scene8PointerId = e.pointerId;
      scene8Start = p;

      try{ scene8.setPointerCapture(e.pointerId); }catch(_){}
    });

    scene8.addEventListener("pointermove", e => {
      if(!scene8Dragging || !scene8Start) return;
      e.preventDefault();

      const p = artPoint(e.clientX,e.clientY);

      if(scene8Phase === 1){
        /* Gold line upward from grabbed rock */
        drawScene8Line(grabbedRock,p);

        if(p.y < scene8Start.y - 150){
          scene8Phase = 2;
          setScene8State(3);
          clearScene8Line();
          scene8Hint.textContent = "Now drag downward toward the bottle";
          scene8Dragging = false;

          try{ scene8.releasePointerCapture(e.pointerId); }catch(_){}
        }
      }
      else if(scene8Phase === 2){
        /* Gold line downward from lifted rock */
        drawScene8Line(liftedRock,p);

        const distanceToBottle = Math.hypot(
          p.x-bottleTarget.x,
          p.y-bottleTarget.y
        );

        if(distanceToBottle < 150){
          scene8Phase = 3;
          scene8Dragging = false;
          drawScene8Line(liftedRock,bottleTarget);
          scene8Hint.textContent = "Ready to break the bottle";

          try{ scene8.releasePointerCapture(e.pointerId); }catch(_){}

          document.dispatchEvent(
            new CustomEvent("scene8MissionComplete")
          );

          setTimeout(() => {
            showScene(scene9);
          }, 550);

          setTimeout(() => {
            showScene(scene9);
          }, 550);
        }
      }
    });

    scene8.addEventListener("pointerup", e => {
      if(!scene8Dragging) return;
      e.preventDefault();

      /* If user releases too early, keep the same state and let them retry. */
      clearScene8Line();
      scene8Dragging = false;
      scene8PointerId = null;
      scene8Start = null;

      if(scene8Phase === 1){
        scene8Hint.textContent = "Drag upward to lift the rock";
      }
      else if(scene8Phase === 2){
        scene8Hint.textContent = "Drag downward toward the bottle";
      }
    });

    scene8.addEventListener("pointercancel", e => {
      if(!scene8Dragging) return;
      e.preventDefault();
      clearScene8Line();
      scene8Dragging = false;
      scene8PointerId = null;
      scene8Start = null;
    });

    /* Touch fallback for older iPad Safari */
    let s8Touch = false;

    scene8.addEventListener("touchstart", e => {
      if(scene8Phase !== 1 && scene8Phase !== 2) return;
      const t = e.changedTouches && e.changedTouches[0];
      if(!t) return;

      const p = artPoint(t.clientX,t.clientY);

      if(scene8Phase === 1 && Math.hypot(p.x-grabbedRock.x,p.y-grabbedRock.y) > 240) return;
      if(scene8Phase === 2 && Math.hypot(p.x-liftedRock.x,p.y-liftedRock.y) > 260) return;

      e.preventDefault();
      s8Touch = true;
      scene8Dragging = true;
      scene8Start = p;
    }, {passive:false});

    scene8.addEventListener("touchmove", e => {
      if(!s8Touch || !scene8Dragging) return;
      const t = e.changedTouches && e.changedTouches[0];
      if(!t) return;
      e.preventDefault();

      const p = artPoint(t.clientX,t.clientY);

      if(scene8Phase === 1){
        drawScene8Line(grabbedRock,p);

        if(p.y < scene8Start.y - 150){
          scene8Phase = 2;
          setScene8State(3);
          clearScene8Line();
          scene8Hint.textContent = "Now drag downward toward the bottle";
          scene8Dragging = false;
          s8Touch = false;
        }
      }
      else if(scene8Phase === 2){
        drawScene8Line(liftedRock,p);

        if(Math.hypot(p.x-bottleTarget.x,p.y-bottleTarget.y) < 150){
          scene8Phase = 3;
          drawScene8Line(liftedRock,bottleTarget);
          scene8Hint.textContent = "Ready to break the bottle";
          scene8Dragging = false;
          s8Touch = false;

          document.dispatchEvent(
            new CustomEvent("scene8MissionComplete")
          );
        }
      }
    }, {passive:false});

    scene8.addEventListener("touchend", e => {
      if(!s8Touch) return;
      e.preventDefault();
      clearScene8Line();
      s8Touch = false;
      scene8Dragging = false;
      scene8Start = null;
    }, {passive:false});


    /* Scene 9 -> Scene 10 */
    scene9Continue.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      setTimeout(() => showScene(scene10), 260);
    });

    /* Scene 10 -> Scene 11 */
    scene10Continue.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      setTimeout(() => showScene(scene11), 260);
    });

    /* Scene 11 -> Scene 12: follow the glow */
    scene11Continue.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      setTimeout(() => showScene(scene12), 260);
    });

    /* Scene 12 -> Scene 13: tap the discovered chest */
    scene12Continue.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      setTimeout(() => showScene(scene13), 260);
    });

    /* Scene 13 -> Scene 14. The video NEVER starts by itself.
       A real tap on the lock gives a short failed-lock glow first. */
    let scene13LockBusy = false;
    function beginScene14FromLock(e){
      if(scene13LockBusy) return;
      scene13LockBusy = true;
      if(e){ e.preventDefault(); pulseAt(e); }
      scene13FailGlow.classList.remove("play");
      void scene13FailGlow.offsetWidth;
      scene13FailGlow.classList.add("play");
      setTimeout(() => {
        resetScene14();
        showScene(scene14);
        playScene14Video();
        scene13LockBusy = false;
      }, 980);
    }
    scene13Lock.addEventListener("click", beginScene14FromLock);

    /* ===== Scene 14: 4-step interaction =====
       1) Tap the crab holding the key.
       2) Tap it again as it scuttles away.
       3) Tap the key after it falls to the sand.
       4) Continue from the success frame.
       The PNGs change as state images; nothing is cropped or duplicated.
    */
    let scene14Phase = 0;

    function setScene14State(n){
      scene14State1.classList.toggle("active14", n === 1);
      scene14State2.classList.toggle("active14", n === 2);
      scene14State3.classList.toggle("active14", n === 3);
      scene14State4.classList.toggle("active14", n === 4);
    }

    function setScene14ActionPhase(phase){
      scene14Action.classList.remove("phase0","phase1","phase2","phase3");
      scene14Action.classList.add("phase" + phase);
      if(phase === 0) scene14Action.setAttribute("aria-label","Tap the crab");
      if(phase === 1) scene14Action.setAttribute("aria-label","Tap the crab again");
      if(phase === 2) scene14Action.setAttribute("aria-label","Tap the key");
      if(phase === 3) scene14Action.setAttribute("aria-label","Continue");
    }

    function resetScene14(){
      scene14Phase = 0;
      setScene14State(1);
      setScene14ActionPhase(0);
      scene14Action.style.pointerEvents = "auto";
    }

    function playScene14Spark(e){
      if(!scene14Spark || typeof e.clientX !== "number") return;
      const r = scene14.getBoundingClientRect();
      scene14Spark.style.left = (e.clientX - r.left) + "px";
      scene14Spark.style.top = (e.clientY - r.top) + "px";
      scene14Spark.classList.remove("play");
      void scene14Spark.offsetWidth;
      scene14Spark.classList.add("play");
    }

    ["./scene14_1.png?v=14","./scene14_2.png?v=14","./scene14_3.png?v=14","./scene14_4.png?v=14"].forEach(src => {
      const img = new Image();
      img.src = src;
    });

    scene14Action.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      playScene14Spark(e);

      if(scene14Phase === 0){
        scene14Phase = 1;
        setScene14State(2);
        setScene14ActionPhase(1);
        updateSceneBackdrop(scene14);
        return;
      }

      if(scene14Phase === 1){
        scene14Phase = 2;
        setScene14State(3);
        setScene14ActionPhase(2);
        updateSceneBackdrop(scene14);
        return;
      }

      if(scene14Phase === 2){
        scene14Phase = 3;
        setScene14State(4);
        setScene14ActionPhase(3);
        updateSceneBackdrop(scene14);
        document.dispatchEvent(new CustomEvent("scene14KeyFound"));
        return;
      }

      /* Scene 14 is the current end of the story.
         The event lets the next scene plug in cleanly when we add it. */
      document.dispatchEvent(new CustomEvent("scene14Complete"));
    });




    /* =========================================================
       Scene 14 + 15 Rock–Paper–Scissors mission
       ========================================================= */
    const scene15Reveal = document.getElementById("scene15Reveal");
    const scene15RevealTap = document.getElementById("scene15RevealTap");
    const scene15RpsChoice = document.getElementById("scene15RpsChoice");
    const scene15PaperLose = document.getElementById("scene15PaperLose");
    const scene15ScissorsTie = document.getElementById("scene15ScissorsTie");
    const scene15RockWin = document.getElementById("scene15RockWin");
    const scene15RpsButtons = document.getElementById("scene15RpsButtons");
    const scene15RpsTapHint = document.getElementById("scene15RpsTapHint");
    let rpsTimer = null;
    let rpsBusy = false;

    function hideAllRpsLayers(){
      if(rpsTimer){ clearTimeout(rpsTimer); rpsTimer=null; }
      [scene15Reveal,scene15RpsChoice,scene15PaperLose,scene15ScissorsTie,scene15RockWin].forEach(el=>{
        el.style.display="none"; el.classList.remove("rpsResultPulse");
      });
      scene15RevealTap.style.display="none";
      scene15RpsButtons.style.display="none";
      scene15RpsTapHint.style.display="none";
      /* old gift/video layers stay disabled */
      scene15Intro.pause(); scene15Reaction.pause(); scene15Success.pause();
      scene15Intro.style.display="none"; scene15Reaction.style.display="none"; scene15Success.style.display="none";
      scene15Choices.style.display="none"; scene15ChoiceHint.style.display="none";
      scene15ReactionFeedback.classList.remove("show");
      scene15KeyDragImage.style.display="none"; scene15KeyCanvas.style.display="none"; scene15KeyStart.style.display="none"; scene15DragHint.style.display="none";
      scene15ChestOpen.pause(); scene15ChestOpen.style.display="none";
    }

    function playScene14Video(){
      scene14Video.currentTime = 0;
      scene14Video.style.display = "block";
      const p = scene14Video.play();
      if(p && typeof p.catch === "function") p.catch(()=>{});
    }

    function showRpsChoice(){
      rpsBusy=false;
      hideAllRpsLayers();
      scene15RpsChoice.style.display="block";
      scene15RpsButtons.style.display="block";
      scene15RpsTapHint.style.display="block";
      updateSceneBackdrop(scene15);
    }

    function startScene15(){
      hideAllRpsLayers();
      showScene(scene15);
      scene15Reveal.style.display="block";
      scene15RevealTap.style.display="block";
      updateSceneBackdrop(scene15);
      /* Let her read the reveal, then continue automatically if she does not tap. */
      rpsTimer=setTimeout(showRpsChoice, 3200);
    }

    scene14Video.addEventListener("ended", ()=>setTimeout(startScene15,180));
    scene15RevealTap.addEventListener("click", e=>{ e.preventDefault(); showRpsChoice(); });

    function showRpsResult(which){
      if(rpsBusy) return;
      rpsBusy=true;
      hideAllRpsLayers();
      let el, ms;
      if(which==="paper"){ el=scene15PaperLose; ms=5200; }
      else if(which==="scissors"){ el=scene15ScissorsTie; ms=3800; }
      else { el=scene15RockWin; ms=4400; }
      el.style.display="block";
      void el.offsetWidth;
      el.classList.add("rpsResultPulse");
      updateSceneBackdrop(scene15);
      rpsTimer=setTimeout(()=>{
        if(which==="rock") enterScene15KeyDrag();
        else showRpsChoice();
      },ms);
    }

    scene15RpsButtons.querySelectorAll(".rpsChoice").forEach(btn=>{
      btn.addEventListener("click", e=>{ e.preventDefault(); e.stopPropagation(); pulseAt(e); showRpsResult(btn.dataset.rps); });
    });

    function enterScene15KeyDrag(){
      rpsBusy=false;
      hideAllRpsLayers();
      scene15KeyDragImage.style.display="block";
      scene15KeyCanvas.style.display="block";
      scene15KeyStart.style.display="block";
      scene15KeyStart.style.pointerEvents="auto";
      scene15DragHint.style.display="block";
      clearScene15KeyLine();
      updateSceneBackdrop(scene15);
    }

    const scene15Key = { x: 760, y: 790 };
    const scene15LockTarget = { x: 1250, y: 570 };
    const scene15LockRadius = 135;
    let scene15Dragging = false;

    function scene15Point(e){
      const r=scene15KeyCanvas.getBoundingClientRect();
      return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
    }
    function clearScene15KeyLine(){ scene15KeyCtx.clearRect(0,0,W,H); }
    function drawScene15KeyLine(p,success=false){
      clearScene15KeyLine(); scene15KeyCtx.save(); scene15KeyCtx.lineCap="round"; scene15KeyCtx.lineJoin="round";
      scene15KeyCtx.shadowColor=success?"rgba(255,225,155,.98)":"rgba(232,183,83,.92)"; scene15KeyCtx.shadowBlur=success?28:18;
      scene15KeyCtx.strokeStyle=success?"rgba(255,230,166,.98)":"rgba(235,191,96,.95)"; scene15KeyCtx.lineWidth=success?5:4; scene15KeyCtx.setLineDash(success?[]:[12,10]);
      scene15KeyCtx.beginPath(); scene15KeyCtx.moveTo(scene15Key.x,scene15Key.y); const mx=(scene15Key.x+p.x)/2,my=(scene15Key.y+p.y)/2-18; scene15KeyCtx.quadraticCurveTo(mx,my,p.x,p.y); scene15KeyCtx.stroke();
      scene15KeyCtx.setLineDash([]); scene15KeyCtx.fillStyle="rgba(255,226,156,.98)"; scene15KeyCtx.beginPath(); scene15KeyCtx.arc(p.x,p.y,success?10:7,0,Math.PI*2); scene15KeyCtx.fill(); scene15KeyCtx.restore();
    }
    function finishScene15KeyDrag(){
      scene15Dragging=false; scene15KeyStart.style.pointerEvents="none"; scene15DragHint.style.display="none"; drawScene15KeyLine(scene15LockTarget,true);
      setTimeout(()=>{ scene15KeyDragImage.style.display="none"; scene15KeyCanvas.style.display="none"; scene15KeyStart.style.display="none"; scene15ChestOpen.style.display="block"; scene15ChestOpen.currentTime=0; const p=scene15ChestOpen.play(); if(p&&typeof p.catch==="function")p.catch(()=>{}); },520);
    }
    function scene15DragStart(e){ e.preventDefault(); scene15Dragging=true; try{scene15KeyStart.setPointerCapture(e.pointerId)}catch(_){} drawScene15KeyLine(scene15Point(e)); }
    function scene15DragMove(e){ if(!scene15Dragging)return; e.preventDefault(); const p=scene15Point(e); drawScene15KeyLine(p); if(Math.hypot(p.x-scene15LockTarget.x,p.y-scene15LockTarget.y)<=scene15LockRadius)finishScene15KeyDrag(); }
    function scene15DragEnd(e){ if(!scene15Dragging)return; e.preventDefault(); scene15Dragging=false; const p=scene15Point(e); if(Math.hypot(p.x-scene15LockTarget.x,p.y-scene15LockTarget.y)<=scene15LockRadius)finishScene15KeyDrag(); else clearScene15KeyLine(); }
    scene15KeyStart.addEventListener("pointerdown",scene15DragStart); scene15KeyStart.addEventListener("pointermove",scene15DragMove); scene15KeyStart.addEventListener("pointerup",scene15DragEnd); scene15KeyStart.addEventListener("pointercancel",scene15DragEnd);
    scene15ChestOpen.addEventListener("ended",()=>showScene(scene16));

    const CARD_RATIO = 1672 / 941;

    function fitCardToIPhone(){
      /*
        window.innerWidth/innerHeight describe Safari's actual webpage area.
        We fit the entire 16:9 card inside it, maximizing height.
      */
      const vw = Math.max(1, window.innerWidth);
      const vh = Math.max(1, window.innerHeight);

      document.documentElement.style.setProperty("--phone-vw", vw + "px");
      document.documentElement.style.setProperty("--phone-vh", vh + "px");

      let w, h;

      if((vw / vh) > CARD_RATIO){
        // Extra-wide Safari landscape: fill height, leave side areas.
        h = vh;
        w = h * CARD_RATIO;
      }else{
        // Narrower viewport: fill width.
        w = vw;
        h = w / CARD_RATIO;
      }

      // 2 px breathing room so the gold frame is never clipped.
      w = Math.max(1, w - 2);
      h = Math.max(1, h - 2);

      document.documentElement.style.setProperty("--fit-w", Math.floor(w) + "px");
      document.documentElement.style.setProperty("--fit-h", Math.floor(h) + "px");
    }

    function refitCard(){
      fitCardToIPhone();
      requestAnimationFrame(fitCardToIPhone);
      setTimeout(fitCardToIPhone, 80);
      setTimeout(fitCardToIPhone, 250);
      setTimeout(fitCardToIPhone, 600);
    }

    window.addEventListener("load", () => {
      refitCard();
      const firstActive = document.querySelector(".scene.active") || document.getElementById("scene1");
      if(firstActive) updateSceneBackdrop(firstActive);
    }, {once:true});

    window.addEventListener("resize", refitCard, {passive:true});
    window.addEventListener("orientationchange", refitCard, {passive:true});

  })();
  </script>
