<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little Adventure</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b13}
*{box-sizing:border-box}
#scene1{
  position:fixed;inset:0;width:100vw;height:100dvh;min-height:100vh;
  background:url('scene1_final.png') center/cover no-repeat;
  cursor:pointer;overflow:hidden
}
.shimmer{
  position:absolute;left:35%;right:-5%;top:45%;bottom:0;
  opacity:.20;mix-blend-mode:screen;pointer-events:none;
  background:repeating-linear-gradient(176deg,transparent 0 10px,rgba(255,255,255,.07) 11px 12px,transparent 13px 23px);
  animation:water 5s linear infinite
}
@keyframes water{to{background-position:110px 38px;transform:translateX(1.2%)}}
#fade{
  position:fixed;inset:0;background:#020b13;opacity:0;pointer-events:none;
  transition:opacity .65s ease;z-index:20
}
#fade.on{opacity:1}
</style>
</head>
<body>
<section id="scene1" aria-label="Our Little Adventure opening scene">
  <div class="shimmer"></div>
</section>
<div id="fade"></div>
<script>
const scene1=document.getElementById('scene1');
const fade=document.getElementById('fade');
scene1.addEventListener('click',()=>{
  fade.classList.add('on');
  setTimeout(()=>fade.classList.remove('on'),650);
});
</script>
</body>
</html>
