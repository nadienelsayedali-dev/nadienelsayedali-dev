<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 8 - Break the Bottle</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #07111f;
      overflow: hidden;
      font-family: Georgia, serif;
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07111f;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      cursor: pointer;
      background: rgba(255,255,255,0);
      border-radius: 24px;
      -webkit-tap-highlight-color: transparent;
    }
    /* State 1: tap the rock */
    #hotspot1 {
      left: 39%;
      top: 66%;
      width: 15%;
      height: 18%;
    }
    /* State 2: tap upper area to lift / continue */
    #hotspot2 {
      left: 33%;
      top: 18%;
      width: 26%;
      height: 32%;
      display: none;
    }
    /* State 3: tap bottle area to finish */
    #hotspot3 {
      left: 68%;
      top: 70%;
      width: 18%;
      height: 18%;
      display: none;
    }
    .hint {
      position: absolute;
      bottom: 3.5%;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      background: rgba(7,17,31,.55);
      color: #f1d08a;
      border: 1px solid rgba(241,208,138,.45);
      border-radius: 999px;
      font-size: 16px;
      letter-spacing: .4px;
      text-shadow: 0 1px 2px rgba(0,0,0,.5);
      backdrop-filter: blur(4px);
    }
    @media (max-width: 768px) {
      .hint { font-size: 14px; bottom: 2.4%; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <img id="sceneImage" src="scene8_1.png" alt="Scene 8 - break the bottle" />
    <div id="hotspot1" class="hotspot" aria-label="Grab a rock"></div>
    <div id="hotspot2" class="hotspot" aria-label="Lift the rock"></div>
    <div id="hotspot3" class="hotspot" aria-label="Drop on the bottle"></div>
    <div id="hint" class="hint">Tap the rock</div>
  </div>

  <script>
    const sceneImage = document.getElementById('sceneImage');
    const hotspot1 = document.getElementById('hotspot1');
    const hotspot2 = document.getElementById('hotspot2');
    const hotspot3 = document.getElementById('hotspot3');
    const hint = document.getElementById('hint');

    function showState(state) {
      if (state === 1) {
        sceneImage.src = 'scene8_1.png';
        hotspot1.style.display = 'block';
        hotspot2.style.display = 'none';
        hotspot3.style.display = 'none';
        hint.textContent = 'Tap the rock';
      } else if (state === 2) {
        sceneImage.src = 'scene8_2.png';
        hotspot1.style.display = 'none';
        hotspot2.style.display = 'block';
        hotspot3.style.display = 'none';
        hint.textContent = 'Tap to lift the rock';
      } else if (state === 3) {
        sceneImage.src = 'scene8_3.png';
        hotspot1.style.display = 'none';
        hotspot2.style.display = 'none';
        hotspot3.style.display = 'block';
        hint.textContent = 'Tap the bottle';
      } else if (state === 4) {
        sceneImage.src = 'scene8_3.png';
        hotspot1.style.display = 'none';
        hotspot2.style.display = 'none';
        hotspot3.style.display = 'none';
        hint.textContent = 'Mission complete';
      }
    }

    hotspot1.addEventListener('click', () => showState(2));
    hotspot2.addEventListener('click', () => showState(3));
    hotspot3.addEventListener('click', () => showState(4));

    showState(1);
  </script>
</body>
</html>
