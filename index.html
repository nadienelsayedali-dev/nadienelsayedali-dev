<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little Adventure</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020b13;
}
*{box-sizing:border-box}

.scene{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  min-height:100vh;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  display:none;
}
.scene.active{display:block}

#s1{
  background-image:url('scene1.png');
  cursor:pointer;
}
#s2{
  background-image:url('scene2_clean.png');
  cursor:pointer;
  overflow:hidden;
}

/* moving sea shimmer */
.sea-shimmer{
  position:absolute;
  left:0;
  right:0;
  top:43%;
  bottom:0;
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:.28;
  background:
    repeating-linear-gradient(
      174deg,
      transparent 0 10px,
      rgba(255,255,255,.075) 11px 12px,
      transparent 13px 23px
    );
  animation:seaShift 5.4s linear infinite;
}
@keyframes seaShift{
  from{background-position:0 0;transform:translateX(-.5%)}
  to{background-position:120px 36px;transform:translateX(1.5%)}
}

/* subtle moonlight */
.moon-path{
  position:absolute;
  left:38%;
  top:43%;
  width:34%;
  height:34%;
  background:linear-gradient(180deg,rgba(255,255,255,.13),transparent 75%);
  filter:blur(16px);
  opacity:.26;
  mix-blend-mode:screen;
  pointer-events:none;
  animation:moonPulse 3.7s ease-in-out infinite alternate;
}
@keyframes moonPulse{
  from{opacity:.18;transform:scaleX(.94)}
  to{opacity:.34;transform:scaleX(1.06)}
}

/* subtle movement cues around the boat/bottle areas */
.boat-glow{
  position:absolute;
  left:56%;
  top:31%;
  width:31%;
  height:39%;
  border-radius:45%;
  pointer-events:none;
  background:radial-gradient(circle at 50% 55%,rgba(255,171,67,.08),transparent 60%);
  animation:boatRock 4.2s ease-in-out infinite;
  transform-origin:50% 70%;
}
@keyframes boatRock{
  0%,100%{transform:translateY(0) rotate(-.3deg)}
  50%{transform:translateY(5px) rotate(.5deg)}
}

.bottle-glow{
  position:absolute;
  left:18%;
  top:60%;
  width:19%;
  height:28%;
  border-radius:45%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(190,225,255,.06),transparent 65%);
  animation:bottleBob 3.1s ease-in-out infinite;
  transform-origin:50% 70%;
}
@keyframes bottleBob{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-10px) rotate(1.8deg)}
}

/* Scene 2 story text */
.story{
  position:absolute;
  left:6vw;
  top:50%;
  transform:translateY(-50%);
  width:min(480px,38vw);
  z-index:10;
  color:#fff6e6;
  font-family:Georgia,"Times New Roman",serif;
  text-shadow:0 4px 22px rgba(0,0,0,.88);
}
.story .label{
  color:#d9ae61;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-size:clamp(.7rem,.9vw,.9rem);
  margin-bottom:14px;
}
.story h2{
  margin:0;
  color:#efc77a;
  font-weight:500;
  line-height:1.06;
  letter-spacing:.025em;
  font-size:clamp(2rem,3.4vw,3.9rem);
}
.story p{
  margin:15px 0 0;
  font-size:clamp(1rem,1.35vw,1.25rem);
  line-height:1.55;
  font-style:italic;
  color:#fff8e9;
}
.tap{
  position:absolute;
  left:50%;
  bottom:3%;
  transform:translateX(-50%);
  color:#eac06d;
  font:600 12px Georgia,"Times New Roman",serif;
  letter-spacing:.18em;
  text-shadow:0 3px 12px #000;
  z-index:12;
  opacity:.82;
  animation:tapPulse 2s ease-in-out infinite;
}
@keyframes tapPulse{
  50%{opacity:1;transform:translateX(-50%) translateY(-3px)}
}

@media(max-width:760px){
  .story{
    left:5vw;
    top:18%;
    transform:none;
    width:86vw;
  }
  .story h2{font-size:2.25rem}
  .story p{font-size:1rem}
  .boat-glow{left:51%;top:32%;width:42%;height:40%}
  .bottle-glow{left:12%;top:62%;width:26%;height:25%}
}
</style>
</head>
<body>

<section id="s1" class="scene active" aria-label="Opening scene"></section>

<section id="s2" class="scene" aria-label="Message from the sea">
  <div class="sea-shimmer"></div>
  <div class="moon-path"></div>
  <div class="boat-glow"></div>
  <div class="bottle-glow"></div>

  <div class="story">
    <div class="label">A message from the sea</div>
    <h2>A message has crossed the ocean…</h2>
    <p>and somehow, it found you.</p>
  </div>

  <div class="tap">TAP TO CONTINUE</div>
</section>

<script>
const s1=document.getElementById('s1');
const s2=document.getElementById('s2');

s1.addEventListener('click',()=>{
  s1.classList.remove('active');
  s2.classList.add('active');
});

/* Scene 2 stays until tap. We do nothing yet because Scene 3 is not connected. */
s2.addEventListener('click',()=>{
  // Scene 3 will be added after Scene 2 is approved.
});
</script>

</body>
</html>
