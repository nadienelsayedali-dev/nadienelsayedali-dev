<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020b13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Little Adventure</title>

  <style>
    :root {
      --bg: #020b13;
      --ratio: 1672/941;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      position: fixed;
      inset: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
    }

    .scene {
      position: absolute;
      width: min(100vw, calc(100dvh * 1672 / 941));
      height: min(100dvh, calc(100vw * 941 / 1672));
      aspect-ratio: var(--ratio);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      background: var(--bg);
      transition: opacity .45s ease;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    .scene img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .hotspot {
      position: absolute;
      z-index: 10;
      border: 0;
      outline: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Scene 1: BEGIN THE STORY */
    #beginStory {
      left: 63.2%;
      top: 75%;
      width: 21.5%;
      height: 10.5%;
    }

    /* Scene 2: TAP TO SAIL FORWARD */
    #scene2Continue {
      left: 61%;
      top: 79%;
      width: 30%;
      height: 11%;
    }

    #tapPulse {
      position: fixed;
      z-index: 30;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(232,183,83,.96);
      box-shadow: 0 0 28px rgba(232,183,83,.82);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.55);
      pointer-events: none;
    }

    #tapPulse.play {
      animation: tapPulse .45s ease forwards;
    }

    @keyframes tapPulse {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.55);
      }
      45% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.45);
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <section id="scene1" class="scene active" aria-label="Scene 1">
      <img src="./scene 1.png" alt="Our Little Adventure" draggable="false">
      <button id="beginStory" class="hotspot" type="button" aria-label="Begin the story"></button>
    </section>

    <section id="scene2" class="scene" aria-label="Scene 2">
      <img src="./scene2.png" alt="Across the Waves" draggable="false">
      <button id="scene2Continue" class="hotspot" type="button" aria-label="Sail forward"></button>
    </section>

    <div id="tapPulse" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      const scene1 = document.getElementById("scene1");
      const scene2 = document.getElementById("scene2");
      const beginStory = document.getElementById("beginStory");
      const scene2Continue = document.getElementById("scene2Continue");
      const tapPulse = document.getElementById("tapPulse");

      function pulseAt(event) {
        tapPulse.style.left = event.clientX + "px";
        tapPulse.style.top = event.clientY + "px";
        tapPulse.classList.remove("play");
        void tapPulse.offsetWidth;
        tapPulse.classList.add("play");
      }

      function showScene(next) {
        document.querySelectorAll(".scene").forEach(scene => scene.classList.remove("active"));
        next.classList.add("active");
      }

      beginStory.addEventListener("pointerup", (event) => {
        event.preventDefault();
        pulseAt(event);
        setTimeout(() => showScene(scene2), 220);
      });

      scene2Continue.addEventListener("pointerup", (event) => {
        event.preventDefault();
        pulseAt(event);

        /*
          Scene 3 / sailing transition will be connected here next.
        */
      });
    })();
  </script>
</body>
</html>
