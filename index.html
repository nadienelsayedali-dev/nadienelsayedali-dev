<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little Adventure</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b13}
*{box-sizing:border-box}
.scene{
 position:fixed;inset:0;width:100vw;height:100dvh;min-height:100vh;
 background-size:cover;background-position:center;background-repeat:no-repeat;
 display:none;overflow:hidden
}
.scene.active{display:block}
#s1{background-image:url('scene1.png');cursor:pointer}
#s2{background-image:url('scene2_clean.png');cursor:pointer}
#s3{background-image:url('scene3_locked.png')}
#s4{background-image:url('scene4_shore.png')}

.sea-shimmer{
 position:absolute;left:0;right:0;top:43%;bottom:0;pointer-events:none;
 mix-blend-mode:screen;opacity:.22;
 background:repeating-linear-gradient(174deg,transparent 0 10px,rgba(255,255,255,.06) 11px 12px,transparent 13px 23px);
 animation:seaShift 5.6s linear infinite
}
@keyframes seaShift{
 from{background-position:0 0;transform:translateX(-.5%)}
 to{background-position:120px 36px;transform:translateX(1.5%)}
}

/* Scene 2 */
.story{
 position:absolute;left:6vw;top:50%;transform:translateY(-50%);
 width:min(470px,38vw);z-index:10;color:#fff6e6;
 font-family:Georgia,"Times New Roman",serif;text-shadow:0 4px 22px rgba(0,0,0,.88)
}
.story .label{color:#d9ae61;letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;margin-bottom:14px}
.story h2{margin:0;color:#efc77a;font-weight:500;line-height:1.06;font-size:clamp(2rem,3.4vw,3.9rem)}
.story p{margin:15px 0 0;font-size:clamp(1rem,1.35vw,1.25rem);font-style:italic;color:#fff8e9}
.tap{
 position:absolute;left:50%;bottom:3%;transform:translateX(-50%);
 color:#eac06d;font:600 12px Georgia,serif;letter-spacing:.18em;
 text-shadow:0 3px 12px #000;z-index:12;opacity:.82;animation:tapPulse 2s ease-in-out infinite
}
@keyframes tapPulse{50%{opacity:1;transform:translateX(-50%) translateY(-3px)}}

/* Scene 3 — one subtle hand glow only */
#grab{
 position:absolute;left:36.5%;top:64%;
 width:70px;height:70px;border-radius:50%;
 border:1px solid rgba(240,193,98,.65);
 box-shadow:0 0 0 8px rgba(240,193,98,.025),0 0 24px rgba(240,193,98,.56);
 background:transparent;z-index:30;cursor:grab;touch-action:none;
 animation:handPulse 1.8s ease-in-out infinite
}
@keyframes handPulse{
 50%{transform:scale(1.05);box-shadow:0 0 0 12px rgba(240,193,98,.015),0 0 30px rgba(240,193,98,.72)}
}
#target3{
 position:absolute;left:5%;top:68%;width:155px;height:180px;
 pointer-events:none;background:transparent
}
#dragDot{
 position:fixed;width:44px;height:44px;border-radius:50%;
 background:radial-gradient(circle,#efc77a 0 12%,rgba(239,199,122,.22) 16%,transparent 62%);
 display:none;z-index:35;pointer-events:none
}
#successSpark{
 position:absolute;left:10%;top:72%;width:100px;height:100px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,220,145,.65),rgba(255,220,145,.15) 30%,transparent 70%);
 opacity:0;pointer-events:none;z-index:45
}
#successSpark.show{animation:sparkPop .8s ease forwards}
@keyframes sparkPop{
 0%{opacity:0;transform:scale(.3)}
 45%{opacity:1;transform:scale(1.25)}
 100%{opacity:0;transform:scale(1.7)}
}

/* Scene 4 */
.shore-copy{
 position:absolute;left:6%;top:10%;width:min(430px,38vw);
 font-family:Georgia,"Times New Roman",serif;text-shadow:0 4px 22px rgba(0,0,0,.9);
 z-index:12
}
.shore-copy .chapter{color:#d9ae61;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;margin-bottom:13px}
.shore-copy h2{margin:0;color:#efc77a;font-weight:500;font-size:clamp(2rem,3.4vw,3.8rem)}
.shore-copy p{margin:12px 0 0;color:#fff5df;font-style:italic;font-size:clamp(1rem,1.25vw,1.15rem)}

#bottleWrap{
 position:absolute;left:58%;top:48%;width:120px;height:250px;z-index:30;
 cursor:grab;touch-action:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));
 transform-origin:50% 80%
}
#bottleWrap.ready{animation:bottleIdle 2.7s ease-in-out infinite}
@keyframes bottleIdle{50%{transform:translateY(-7px) rotate(2deg)}}
#bottleWrap svg{width:100%;height:100%}
#rockTarget{
 position:absolute;left:53%;bottom:12%;width:260px;height:115px;border-radius:50%;
 background:radial-gradient(ellipse at center,rgba(40,34,31,.86) 0 45%,rgba(18,17,18,.9) 65%,transparent 70%);
 filter:drop-shadow(0 12px 12px rgba(0,0,0,.45));z-index:20
}
.drop-hint{
 position:absolute;left:50%;bottom:3%;transform:translateX(-50%);
 color:#eac06d;font:600 12px Georgia,serif;letter-spacing:.16em;
 text-shadow:0 3px 12px #000;z-index:40
}
#breakFlash{
 position:absolute;left:55%;bottom:10%;width:180px;height:180px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,223,155,.9),rgba(255,184,70,.22) 35%,transparent 68%);
 opacity:0;z-index:50;pointer-events:none
}
#breakFlash.show{animation:breakPop .7s ease forwards}
@keyframes breakPop{
 0%{opacity:0;transform:scale(.3)}
 40%{opacity:1;transform:scale(1.2)}
 100%{opacity:0;transform:scale(1.8)}
}
#paper{
 position:absolute;left:56%;bottom:18%;width:140px;height:82px;
 background:linear-gradient(#f1dfb5,#d8bd82);border-radius:4px;
 box-shadow:0 8px 20px rgba(0,0,0,.35);opacity:0;transform:rotate(-8deg) scale(.6);
 z-index:52
}
#paper.show{animation:paperOut .9s .2s ease forwards}
@keyframes paperOut{to{opacity:1;transform:translateY(-90px) rotate(4deg) scale(1)}}

@media(max-width:760px){
 .story{left:5vw;top:18%;transform:none;width:86vw}
 .shore-copy{left:5%;top:6%;width:85vw}
 #grab{left:35%;top:64%;width:62px;height:62px}
 #target3{left:4%;top:69%;width:120px;height:145px}
 #bottleWrap{left:58%;top:50%;width:88px;height:190px}
 #rockTarget{left:48%;bottom:12%;width:220px;height:95px}
}
</style>
</head>
<body>

<section id="s1" class="scene active"></section>

<section id="s2" class="scene">
 <div class="sea-shimmer"></div>
 <div class="story">
   <div class="label">A message from the sea</div>
   <h2>A message has crossed the ocean…</h2>
   <p>and somehow, it found you.</p>
 </div>
 <div class="tap">TAP TO CONTINUE</div>
</section>

<section id="s3" class="scene">
 <div class="sea-shimmer"></div>
 <div id="grab"></div>
 <div id="target3"></div>
 <div id="dragDot"></div>
 <div id="successSpark"></div>
</section>

<section id="s4" class="scene">
 <div class="sea-shimmer"></div>
 <div class="shore-copy">
   <div class="chapter">The shore</div>
   <h2>It won't open.</h2>
   <p>Maybe the sea brought you exactly what you need.</p>
 </div>

 <div id="rockTarget"></div>

 <div id="bottleWrap" class="ready">
  <svg viewBox="0 0 120 250" aria-label="Bottle">
   <defs>
    <linearGradient id="glass" x1="0" x2="1">
     <stop offset="0" stop-color="#c9edf2" stop-opacity=".32"/>
     <stop offset=".45" stop-color="#ffffff" stop-opacity=".12"/>
     <stop offset="1" stop-color="#74a9b5" stop-opacity=".26"/>
    </linearGradient>
   </defs>
   <path d="M45 18h30v31c0 10 6 18 16 27 15 14 21 31 21 58v65c0 24-17 37-52 37S8 223 8 199v-65c0-27 6-44 21-58 10-9 16-17 16-27z"
    fill="url(#glass)" stroke="#d8f0f0" stroke-opacity=".65" stroke-width="3"/>
   <rect x="42" y="8" width="36" height="18" rx="3" fill="#6d442d"/>
   <path d="M32 124c20-15 37-22 56-24l-2 78c-21 4-39 11-57 23z" fill="#e5d2a5" opacity=".95"/>
  </svg>
 </div>

 <div class="drop-hint">LIFT THE BOTTLE • RELEASE IT OVER THE ROCK</div>
 <div id="breakFlash"></div>
 <div id="paper"></div>
</section>

<script>
const scenes=[...document.querySelectorAll('.scene')];
function activate(id){
 scenes.forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
document.getElementById('s1').addEventListener('click',()=>activate('s2'));
document.getElementById('s2').addEventListener('click',()=>activate('s3'));

/* Scene 3 */
const grab=document.getElementById('grab');
const target3=document.getElementById('target3');
const dragDot=document.getElementById('dragDot');
const spark=document.getElementById('successSpark');
let dragging3=false;

function placeDot(x,y){
 dragDot.style.left=(x-22)+'px';
 dragDot.style.top=(y-22)+'px';
 dragDot.style.display='block';
}
function hit(el,x,y){
 const r=el.getBoundingClientRect();
 return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}
grab.addEventListener('pointerdown',e=>{
 dragging3=true;
 grab.setPointerCapture?.(e.pointerId);
 placeDot(e.clientX,e.clientY);
});
window.addEventListener('pointermove',e=>{
 if(!dragging3)return;
 placeDot(e.clientX,e.clientY);
 if(hit(target3,e.clientX,e.clientY)){
  dragging3=false;
  dragDot.style.display='none';
  spark.classList.add('show');
  setTimeout(()=>activate('s4'),850);
 }
});
window.addEventListener('pointerup',()=>{
 if(dragging3){
  dragging3=false;
  dragDot.style.display='none';
 }
});

/* Scene 4 */
const bottle=document.getElementById('bottleWrap');
const rock=document.getElementById('rockTarget');
const breakFlash=document.getElementById('breakFlash');
const paper=document.getElementById('paper');
let dragging4=false, movedHigh=false;

bottle.addEventListener('pointerdown',e=>{
 dragging4=true;
 bottle.classList.remove('ready');
 bottle.setPointerCapture?.(e.pointerId);
});
window.addEventListener('pointermove',e=>{
 if(!dragging4)return;
 const box=document.getElementById('s4').getBoundingClientRect();
 let x=e.clientX-box.left-bottle.offsetWidth/2;
 let y=e.clientY-box.top-bottle.offsetHeight/2;
 x=Math.max(0,Math.min(box.width-bottle.offsetWidth,x));
 y=Math.max(0,Math.min(box.height-bottle.offsetHeight,y));
 bottle.style.left=x+'px';
 bottle.style.top=y+'px';
 bottle.style.transform='rotate('+(x%14-7)+'deg)';
 if(y<box.height*.28)movedHigh=true;
});
window.addEventListener('pointerup',()=>{
 if(!dragging4)return;
 dragging4=false;
 const br=bottle.getBoundingClientRect();
 const rr=rock.getBoundingClientRect();
 const cx=br.left+br.width/2, cy=br.top+br.height/2;
 const overRock=cx>rr.left&&cx<rr.right&&cy>rr.top-80&&cy<rr.bottom;
 if(movedHigh&&overRock){
  bottle.style.transition='transform .28s ease, opacity .25s ease';
  bottle.style.transform='translateY(70px) rotate(38deg)';
  setTimeout(()=>{
   bottle.style.opacity='0';
   breakFlash.classList.add('show');
   paper.classList.add('show');
  },260);
 } else {
  bottle.classList.add('ready');
  movedHigh=false;
 }
});
</script>
</body>
</html>
