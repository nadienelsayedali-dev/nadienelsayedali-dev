<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020b13" />
  <title>Our Little Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020b13;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020b13;
    }

    #scene1 {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity .45s ease;
    }

    #scene1 img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #020b13;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* Invisible tap area over BEGIN THE STORY */
    #beginStory {
      position: absolute;
      left: 62%;
      top: 70%;
      width: 27%;
      height: 14%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    #tapPulse {
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid rgba(232, 183, 83, .95);
      box-shadow: 0 0 30px rgba(232, 183, 83, .75);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.55);
      pointer-events: none;
      z-index: 20;
    }

    #tapPulse.play {
      animation: pulse .48s ease forwards;
    }

    @keyframes pulse {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.55);
      }
      45% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.45);
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="scene1" aria-label="Scene 1">
      <img src="scene%201.png" alt="Our Little Adventure" />
      <button id="beginStory" aria-label="Begin the story"></button>
      <div id="tapPulse"></div>
    </section>
  </main>

  <script>
    const beginStory = document.getElementById("beginStory");
    const tapPulse = document.getElementById("tapPulse");
    const scene1 = document.getElementById("scene1");

    function pulseAt(event) {
      const rect = scene1.getBoundingClientRect();
      tapPulse.style.left = (event.clientX - rect.left) + "px";
      tapPulse.style.top = (event.clientY - rect.top) + "px";
      tapPulse.classList.remove("play");
      void tapPulse.offsetWidth;
      tapPulse.classList.add("play");
    }

    beginStory.addEventListener("pointerup", (event) => {
      event.preventDefault();
      pulseAt(event);

      /*
        Scene 2 will be connected here next.
        Keeping Scene 1 standalone prevents broken links while you upload it.
      */
    });
  </script>
</body>
</html>
