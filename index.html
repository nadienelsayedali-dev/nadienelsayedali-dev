<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mirror Mission</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #020b18; overflow: hidden; font-family: Georgia, serif;
    }
    .screen {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(15,35,60,0.35), rgba(2,8,20,0.95));
    }
    img {
      max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh;
      object-fit: contain; user-select: none; -webkit-user-drag: none;
    }
    .nav {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10; background: rgba(0,0,0,0.35);
      padding: 10px 14px; border-radius: 999px; backdrop-filter: blur(6px);
    }
    button {
      border: 1px solid rgba(214,173,89,0.55); background: rgba(30,20,10,0.75);
      color: #f3d28a; padding: 10px 16px; border-radius: 999px; font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    .counter {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      color: #f3d28a; background: rgba(0,0,0,0.35); padding: 8px 14px; border-radius: 999px;
      z-index: 10; font-size: 14px; letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="counter" id="counter"></div>
  <div class="screen"><img id="scene" src="scene21_intro.png" alt="Mirror mission scene" /></div>
  <div class="nav">
    <button id="prevBtn">◀ Previous</button>
    <button id="nextBtn">Next ▶</button>
  </div>
  <script>
    const scenes = [
      'scene21_intro.png',
      'scene22_choice.png',
      'scene23_wrong_choice.png',
      'scene24_puzzle.png',
      'scene25_symbol.png',
      'scene26_portal.png'
    ];
    let index = 0;
    const img = document.getElementById('scene');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    function render() {
      img.src = scenes[index];
      counter.textContent = `${index + 1} / ${scenes.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === scenes.length - 1;
    }
    prevBtn.addEventListener('click', () => { if (index > 0) { index--; render(); } });
    nextBtn.addEventListener('click', () => { if (index < scenes.length - 1) { index++; render(); } });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && index < scenes.length - 1) { index++; render(); }
      if (e.key === 'ArrowLeft' && index > 0) { index--; render(); }
    });
    render();
  </script>
</body>
</html>
