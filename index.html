<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mayoya Adventure Story</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #0d2244 0%, #071221 60%, #030811 100%);
      font-family: Georgia, serif;
      color: #f0d8a8;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    .media {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      width: 100%; height: 100%;
    }
    .media.active { display: flex; }
    .media img, .media video {
      width: 100%; height: 100%; object-fit: contain; object-position: center;
      background: #020710;
    }
    .hud {
      position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px;
      display: flex; justify-content: space-between; z-index: 9; pointer-events: none;
    }
    .chip {
      background: rgba(4,10,19,.58); border: 1px solid rgba(240,216,168,.33); color:#f0d8a8;
      border-radius: 999px; padding: 8px 12px; font-size: 14px; backdrop-filter: blur(8px);
    }
    #hint {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 72px); z-index: 9;
      background: rgba(4,10,19,.58); border: 1px solid rgba(240,216,168,.33);
      border-radius: 999px; padding: 8px 14px; font-size: 13px; white-space: nowrap;
      backdrop-filter: blur(8px);
    }
    .controls {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px);
      display: flex; gap: 10px; z-index: 10;
    }
    button {
      border: 1px solid rgba(240,216,168,.38); background: rgba(4,10,19,.7); color: #f0d8a8;
      border-radius: 999px; padding: 10px 16px; font: inherit; min-width: 76px; backdrop-filter: blur(8px);
    }
    #tapZone { position:absolute; inset:0; z-index:5; }
    .progress-wrap {
      position:absolute; left:12px; right:12px; bottom: calc(env(safe-area-inset-bottom) + 120px);
      height:4px; background: rgba(255,255,255,.12); border-radius:999px; overflow:hidden; z-index:9;
    }
    #progressBar { width:0%; height:100%; background: linear-gradient(90deg, #f0d8a8, #c99952); }
  </style>
</head>
<body>
  <div id="app">
    <div id="tapZone"></div>
    <div class="hud">
      <div class="chip" id="sceneLabel">Scene 1</div>
      <div class="chip">Mayoya's Moonlit Adventure</div>
    </div>
    <div class="progress-wrap"><div id="progressBar"></div></div>
    <div id="hint">Tap anywhere to continue</div>

    <div class="media active"><img src="scene1.png" alt="Scene 1"></div>
    <div class="media"><img src="scene2.png" alt="Scene 2"></div>
    <div class="media"><img src="scene3.png" alt="Scene 3"></div>
    <div class="media"><img src="scene4.png" alt="Scene 4"></div>
    <div class="media"><img src="scene5.png" alt="Scene 5"></div>
    <div class="media"><img src="scene6.png" alt="Scene 6"></div>
    <div class="media"><img src="scene7.png" alt="Scene 7"></div>
    <div class="media"><img src="scene8_1.png" alt="Scene 8.1"></div>
    <div class="media"><img src="scene8_2.png" alt="Scene 8.2"></div>
    <div class="media"><img src="scene8_3.png" alt="Scene 8.3"></div>
    <div class="media"><img src="scene9.png" alt="Scene 9"></div>
    <div class="media"><img src="scene10.png" alt="Scene 10"></div>
    <div class="media"><img src="scene11.png" alt="Scene 11"></div>
    <div class="media"><img src="scene12.png" alt="Scene 12"></div>
    <div class="media"><img src="scene13.png" alt="Scene 13"></div>
    <div class="media"><video id="scene14Video" src="scene14.mp4" playsinline preload="auto"></video></div>

    <div class="controls">
      <button id="prevBtn" type="button">Prev</button>
      <button id="playPauseBtn" type="button">Pause</button>
      <button id="nextBtn" type="button">Next</button>
    </div>
  </div>

<script>
const scenes = [
  {label:'Scene 1', type:'image', duration:5000},
  {label:'Scene 2', type:'image', duration:5200},
  {label:'Scene 3', type:'image', duration:7600},
  {label:'Scene 4', type:'image', duration:7600},
  {label:'Scene 5', type:'image', duration:6800},
  {label:'Scene 6', type:'image', duration:5000},
  {label:'Scene 7', type:'image', duration:5200},
  {label:'Scene 8 • Grab the rock', type:'image', duration:4600},
  {label:'Scene 8 • Lift the rock', type:'image', duration:4600},
  {label:'Scene 8 • Drop the rock', type:'image', duration:4800},
  {label:'Scene 9', type:'image', duration:4800},
  {label:'Scene 10', type:'image', duration:6200},
  {label:'Scene 11', type:'image', duration:5200},
  {label:'Scene 12', type:'image', duration:5200},
  {label:'Scene 13', type:'image', duration:5200},
  {label:'Scene 14 • The Key Thief', type:'video'}
];
const mediaEls = [...document.querySelectorAll('.media')];
const sceneLabel = document.getElementById('sceneLabel');
const hint = document.getElementById('hint');
const progressBar = document.getElementById('progressBar');
const tapZone = document.getElementById('tapZone');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playPauseBtn = document.getElementById('playPauseBtn');
const scene14Video = document.getElementById('scene14Video');
let index = 0, timer = null, progressTimer = null, playing = true, startedAt = 0, currentDuration = 0;
function clearTimers(){ if(timer) clearTimeout(timer); if(progressTimer) clearInterval(progressTimer); timer=null; progressTimer=null; progressBar.style.width='0%'; }
function stopVideo(){ scene14Video.pause(); scene14Video.currentTime = 0; }
function updatePlayBtn(){ playPauseBtn.textContent = playing ? 'Pause' : 'Play'; }
function startProgress(d){ if(!d) return; startedAt = performance.now(); currentDuration = d; progressTimer = setInterval(()=>{ const pct = Math.min(100, ((performance.now()-startedAt)/d)*100); progressBar.style.width = pct + '%'; },100); }
function schedule(d){ clearTimers(); if(!playing) return; startProgress(d); timer = setTimeout(()=>goTo(index+1), d); }
function goTo(i){ if(i<0) i=0; if(i>=scenes.length) i=0; clearTimers(); stopVideo(); mediaEls.forEach((el,n)=> el.classList.toggle('active', n===i)); index = i; const scene = scenes[i]; sceneLabel.textContent = scene.label; prevBtn.disabled = i===0; hint.textContent = i===scenes.length-1 ? 'Scene 14 clip • Tap next to replay from the start' : 'Tap anywhere to continue';
  if(scene.type==='video'){
    scene14Video.play().catch(()=>{});
    const startVideoBar = ()=>{ clearTimers(); if(!playing) return; progressTimer = setInterval(()=>{ const dur = scene14Video.duration || 0; progressBar.style.width = dur ? ((scene14Video.currentTime/dur)*100)+'%' : '0%'; },100); };
    if(scene14Video.readyState >= 1) startVideoBar(); else scene14Video.onloadedmetadata = startVideoBar;
    scene14Video.onended = ()=>{ progressBar.style.width='100%'; if(playing) setTimeout(()=>goTo(0),900); };
  } else schedule(scene.duration);
  updatePlayBtn();
}
function next(){ goTo(index+1); }
function prev(){ goTo(index-1); }
function togglePlay(){ playing = !playing; if(scenes[index].type==='video'){ if(playing) scene14Video.play().catch(()=>{}); else scene14Video.pause(); } else { if(playing) schedule(currentDuration || scenes[index].duration); else clearTimers(); } updatePlayBtn(); }

tapZone.addEventListener('click', next);
nextBtn.addEventListener('click', e=>{e.stopPropagation(); next();});
prevBtn.addEventListener('click', e=>{e.stopPropagation(); prev();});
playPauseBtn.addEventListener('click', e=>{e.stopPropagation(); togglePlay();});
let sx=0, sy=0;
tapZone.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
tapZone.addEventListener('touchend', e=>{ const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy; if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ if(dx<0) next(); else prev(); } }, {passive:true});
goTo(0);
</script>
</body>
</html>
