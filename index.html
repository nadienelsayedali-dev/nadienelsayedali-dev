<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020b13">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Little Adventure · v37</title>

  <style>
    :root{
      --bg:#020b13;
      --ratio:1672/941;
      --gold:#e8b753;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      width:100%;
      height:100%;
      min-height:100dvh;
      overflow:hidden;
      background:var(--bg);
    }

    body{
      position:fixed;
      inset:0;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      touch-action:none;
      overscroll-behavior:none;
    }

    #app{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:var(--bg);
    }

    .scene{
      position:absolute;
      width:min(100vw,calc(100dvh * 1672 / 941));
      height:min(100dvh,calc(100vw * 941 / 1672));
      aspect-ratio:var(--ratio);
      overflow:hidden;
      opacity:0;
      pointer-events:none;
      background:var(--bg);
      transition:opacity .62s ease;
    }

    .scene.active{
      opacity:1;
      pointer-events:auto;
    }

    /* v39 safety: invisible scenes must NEVER steal taps or drags.
       This is especially important for the mirror puzzle on iPhone/iPad Safari. */
    .scene:not(.active),
    .scene:not(.active) *{
      pointer-events:none !important;
    }

    .scene.active{
      visibility:visible;
    }

    .scene img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:fill;
      pointer-events:none;
      -webkit-user-drag:none;
    }

    .hotspot{
      position:absolute;
      z-index:30;
      border:0;
      outline:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }

    /* Scene 1 */
    #beginStory{
      left:63.2%;
      top:75%;
      width:21.5%;
      height:10.5%;
    }

    /* Scene 2 */
    #scene2Continue{
      left:61%;
      top:79%;
      width:30%;
      height:11%;
    }

    /* Scene 5 line-drag layer */
    #reachCanvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:20;
      pointer-events:none;
    }

    /*
      Invisible start area around her reaching hand.
      The bottle itself never moves.
    */
    #handDragStart{
      left:47%;
      top:61%;
      width:13%;
      height:17%;
      z-index:40;
      cursor:grab;
    }

    #handDragStart.dragging{
      cursor:grabbing;
    }

    /* Success scene: CONTINUE button */
    #scene6Continue{
      left:67.5%;
      top:72.5%;
      width:21.5%;
      height:11%;
      z-index:40;
    }

    /* Scene 7: CONTINUE button */
    #scene7Continue{
      left:67%;
      top:73%;
      width:22%;
      height:11%;
      z-index:40;
    }

    #missionHint{
      position:absolute;
      left:50%;
      bottom:2.7%;
      transform:translateX(-50%);
      z-index:35;
      padding:.42rem .9rem;
      border:1px solid rgba(232,183,83,.4);
      border-radius:999px;
      background:rgba(2,11,19,.42);
      color:#efd18c;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(12px,1.25vw,21px);
      letter-spacing:.045em;
      text-shadow:0 2px 8px #000;
      opacity:0;
      pointer-events:none;
      transition:opacity .3s ease;
      backdrop-filter:blur(3px);
    }

    #scene5.active #missionHint{
      opacity:.94;
    }

    #missionHint.done{
      opacity:0 !important;
    }

    #tapPulse{
      position:fixed;
      z-index:80;
      width:72px;
      height:72px;
      border-radius:50%;
      border:2px solid rgba(232,183,83,.96);
      box-shadow:0 0 28px rgba(232,183,83,.82);
      opacity:0;
      transform:translate(-50%,-50%) scale(.55);
      pointer-events:none;
    }

    #tapPulse.play{
      animation:tapPulse .45s ease forwards;
    }

    @keyframes tapPulse{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
      45%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}
    }
  
    /* ===== Scene 8: Grab -> Lift -> Drop ===== */
    #scene8{
      background:#020b13;
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }

    .scene8State{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:fill;
      opacity:0;
      transform:scale(1.003);
      transition:opacity .38s ease, transform .38s ease;
      pointer-events:none;
      -webkit-user-drag:none;
    }

    .scene8State.active8{
      opacity:1;
      transform:scale(1);
    }

    #scene8Gesture{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:55;
      pointer-events:none;
    }

    #scene8TapRock{
      position:absolute;
      left:68%;
      top:65%;
      width:28%;
      height:31%;
      z-index:65;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    #scene8Hint{
      position:absolute;
      left:50%;
      bottom:2.7%;
      transform:translateX(-50%);
      z-index:70;
      padding:.43rem .95rem;
      border:1px solid rgba(232,183,83,.42);
      border-radius:999px;
      background:rgba(2,11,19,.46);
      color:#efd18b;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(12px,1.2vw,20px);
      letter-spacing:.04em;
      text-shadow:0 2px 8px #000;
      backdrop-filter:blur(3px);
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease;
      white-space:nowrap;
    }

    #scene8.active #scene8Hint{
      opacity:.95;
    }

  
    /* ===== Scene 9: broken-bottle reveal ===== */
    #scene9Continue{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:40;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

  
    /* ===== Scene 10: message letter ===== */
    #scene10Continue{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:40;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

  
    /* ===== Scene 11: The First Clue ===== */
    #scene11Continue{
      position:absolute;
      left:59%;
      top:80%;
      width:29%;
      height:10%;
      z-index:45;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

  
    /* ===== Scene 12: hidden chest discovery ===== */
    #scene12Continue{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:45;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    /* ===== Scene 13: locked secret ===== */
    #scene13Lock{
      position:absolute;
      left:56%;
      top:61%;
      width:18%;
      height:25%;
      z-index:50;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    /* =========================================================
       iPHONE BEST-FIT LAYOUT
       Full artwork visible, maximum height, soft side fill.
       ========================================================= */

    #rotatePhone{
      display:none;
      position:fixed;
      inset:0;
      z-index:10000;
      align-items:center;
      justify-content:center;
      padding:28px;
      background:#020b13;
      color:#efc978;
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
    }

    .rotateCard{
      max-width:420px;
      padding:26px 24px;
      border:1px solid rgba(239,201,120,.38);
      border-radius:22px;
      background:rgba(7,20,32,.84);
      box-shadow:0 0 35px rgba(0,0,0,.35);
    }

    .rotateIcon{
      font-size:52px;
      line-height:1;
      margin-bottom:12px;
    }

    .rotateTitle{
      font-size:24px;
      letter-spacing:.08em;
      margin-bottom:8px;
    }

    .rotateText{
      color:#f5e4ba;
      font-size:16px;
      line-height:1.45;
    }

    #sceneBackdrop{
      position:absolute;
      z-index:0;
      inset:-8%;
      width:116%;
      height:116%;
      object-fit:cover;
      object-position:center;
      filter:blur(28px) brightness(.34) saturate(1.08);
      transform:scale(1.06);
      opacity:1;
      pointer-events:none;
      transition:opacity .35s ease;
    }

    #app::after{
      content:"";
      position:absolute;
      z-index:1;
      inset:0;
      pointer-events:none;
      background:rgba(2,11,19,.12);
    }

    @media (orientation:portrait){
      #rotatePhone{display:flex !important;}
      #app{visibility:hidden !important;}
    }

    @media (orientation:landscape){
      html,body{
        width:100% !important;
        height:100% !important;
        min-height:0 !important;
        margin:0 !important;
        padding:0 !important;
        overflow:hidden !important;
        background:#020b13 !important;
      }

      body{
        position:fixed !important;
        inset:0 !important;
      }

      #rotatePhone{display:none !important;}

      #app{
        visibility:visible !important;
        position:fixed !important;
        left:0 !important;
        top:0 !important;
        width:var(--phone-vw, 100vw) !important;
        height:var(--phone-vh, 100vh) !important;
        min-width:0 !important;
        min-height:0 !important;
        padding:0 !important;
        margin:0 !important;
        overflow:hidden !important;
        display:flex !important;
        align-items:center !important;
        justify-content:center !important;
        background:#020b13 !important;
      }

      .scene{
        position:absolute !important;
        left:50% !important;
        top:50% !important;
        width:var(--fit-w) !important;
        height:var(--fit-h) !important;
        aspect-ratio:1672 / 941 !important;
        transform:translate(-50%,-50%) !important;
        margin:0 !important;
        max-width:none !important;
        max-height:none !important;
        z-index:5 !important;
        box-shadow:0 0 34px rgba(0,0,0,.42);
      }

      .scene img,
      .scene8State{
        position:absolute !important;
        inset:0 !important;
        width:100% !important;
        height:100% !important;
        object-fit:fill !important;
        object-position:center !important;
      }

      #scene5Canvas,
      #reachCanvas,
      #scene8Gesture{
        position:absolute !important;
        inset:0 !important;
        width:100% !important;
        height:100% !important;
      }
    }

  
    /* ===== Gentle iPhone landscape zoom =====
       1.08 = slightly wider/larger, while keeping the important content visible.
       The whole scene (including hotspots/canvases) scales together.
    */
    @media (orientation:landscape){
      .scene{
        transform:translate(-50%,-50%) scale(1.08) !important;
        transform-origin:center center !important;
      }
    }

  

    /* ===== Locked crab conversation + Rock/Paper/Scissors mission ===== */
    #scene14DialogueContinue,#scene14InstructionContinue,#scene14HowContinue,#scene15PortalContinue{
      position:absolute;inset:0;width:100%;height:100%;z-index:55;
      border:0;background:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    }
    #scene15RpsChoice,#scene15PaperLose,#scene15ScissorsTie,#scene15RockWin{
      position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
      display:none;z-index:30;pointer-events:none;
    }
    #scene15RpsButtons{position:absolute; inset:0; z-index:55; display:none; pointer-events:none;}
    .rpsChoice{
      position:absolute; bottom:4.1%; height:18%; border:0; background:transparent;
      border-radius:22px; pointer-events:auto; touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .rpsChoice.rock{left:9.5%;width:26.5%;}
    .rpsChoice.paper{left:36.8%;width:26.5%;}
    .rpsChoice.scissors{left:64.0%;width:26.5%;}
    .rpsChoice:active{background:rgba(241,193,95,.10);box-shadow:0 0 30px rgba(241,193,95,.25) inset;}
    #scene15KeyCanvas{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:64;pointer-events:none;}
    #scene15KeyStart{
      position:absolute;left:57.5%;top:81.5%;width:16%;height:15%;display:none;z-index:65;
      border:0;background:transparent;touch-action:none;-webkit-tap-highlight-color:transparent;
    }
    #scene15DragHint{
      position:absolute;left:50%;bottom:2.7%;transform:translateX(-50%);display:none;z-index:70;
      padding:.48rem 1.2rem;border:1px solid rgba(239,201,120,.55);border-radius:999px;
      background:rgba(2,11,19,.68);color:#efd18b;font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(14px,1.45vw,23px);letter-spacing:.06em;text-shadow:0 2px 8px #000;pointer-events:none;
    }
    #scene16 img{object-fit:fill;}

  

    /* === Alchemy mission (Scenes 16–20) === */
    #scene16Continue,#scene17Continue,#scene19Continue{
      position:absolute; inset:0; width:100%; height:100%; z-index:72;
      border:0; background:transparent; padding:0; margin:0;
      appearance:none; -webkit-appearance:none; touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    #scene18IngredientButtons{position:absolute;inset:0;z-index:76;}
    .alchemyIngredient{
      position:absolute;border:0;background:transparent;padding:0;margin:0;
      appearance:none;-webkit-appearance:none;touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;border-radius:18px;
    }
    .alchemyIngredient:active{background:rgba(239,198,105,.10);}
    .alchemyIngredient.stardust{left:1.5%;top:57%;width:17%;height:34%;}
    .alchemyIngredient.moonwater{left:17.5%;top:57%;width:17%;height:34%;}
    .alchemyIngredient.pearl{left:31.5%;top:57%;width:15%;height:34%;}
    .alchemyIngredient.golden{left:64%;top:48%;width:15%;height:31%;}
    .alchemyIngredient.blue{left:78%;top:49%;width:20%;height:34%;}
    #alchemySlots{position:absolute;inset:0;z-index:77;pointer-events:none;}
    .alchemySlotMark{
      position:absolute;top:78.4%;width:4.8%;height:6.8%;
      display:grid;place-items:center;border-radius:999px;
      color:#ffe4a1;font-family:Georgia,serif;font-weight:700;
      font-size:clamp(18px,2.4vw,34px);text-shadow:0 0 13px #f1b947,0 0 24px #f1b947;
      opacity:0;transform:scale(.75);transition:opacity .22s ease,transform .22s ease;
    }
    .alchemySlotMark.on{opacity:1;transform:scale(1);}
    #alchemySlot1{left:41.1%;} #alchemySlot2{left:50.7%;} #alchemySlot3{left:60.3%;}
    #alchemyStatus{
      position:absolute;left:50%;bottom:5.2%;transform:translateX(-50%);
      z-index:80;padding:.55em 1.1em;border:1px solid rgba(230,184,92,.72);
      border-radius:999px;background:rgba(6,11,20,.78);color:#f5d797;
      font:600 clamp(14px,1.7vw,24px)/1.1 Georgia,serif;letter-spacing:.02em;
      opacity:0;pointer-events:none;transition:opacity .2s ease;white-space:nowrap;
      box-shadow:0 0 18px rgba(219,166,64,.18);
    }
    #alchemyStatus.show{opacity:1;}
    #scene18.wrongFlash{animation:alchemyWrong .42s ease 1;}
    @keyframes alchemyWrong{0%,100%{filter:none}45%{filter:brightness(.82) sepia(.15)}}



    /* ===== Mirror World: second mission ===== */
    #scene20Continue,#scene21Continue,#scene23Retry,#scene25Continue,#scene26PortalTouch{
      position:absolute; inset:0; width:100%; height:100%; z-index:80;
      border:0; padding:0; margin:0; background:transparent;
      appearance:none; -webkit-appearance:none; cursor:pointer;
      touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    }

    #scene22MirrorButtons{position:absolute;inset:0;z-index:85;}
    .mirrorChoice{
      position:absolute; top:14%; height:63%; border:0; background:transparent;
      appearance:none; -webkit-appearance:none; touch-action:manipulation;
      -webkit-tap-highlight-color:transparent; cursor:pointer;
    }
    .mirrorChoice.m1{left:24%;width:17%;}
    .mirrorChoice.m2{left:41%;width:17%;}
    .mirrorChoice.m3{left:58%;width:18%;}
    .mirrorChoice.m4{left:76%;width:17%;}

    #scene24PuzzleLayer{position:absolute;inset:0;z-index:95;touch-action:none;}
    .puzzleOrigin{
      position:absolute; border:0; background:transparent; padding:0; margin:0;
      appearance:none; -webkit-appearance:none; touch-action:none; cursor:grab;
      -webkit-tap-highlight-color:transparent;
    }
    .puzzleOrigin.dragging{cursor:grabbing;}
    .puzzleCover{
      position:absolute; display:none; z-index:96; background:rgba(3,12,29,.94);
      border:1px solid rgba(232,183,83,.75); clip-path:polygon(var(--poly));
      pointer-events:none; box-shadow:0 0 16px rgba(232,183,83,.18) inset;
    }
    #puzzleGhost{
      position:absolute; display:none; z-index:110; pointer-events:none;
      transform:translate(-50%,-50%); transform-origin:center center;
      filter:drop-shadow(0 0 14px rgba(232,183,83,.85));
      height:auto !important;
      object-fit:contain !important;
      max-width:none !important;
    }
    .fixedPuzzlePiece{
      height:auto !important;
      object-fit:contain !important;
      max-width:none !important;
      transform:translate(-50%,-50%);
      transform-origin:center center;
      filter:drop-shadow(0 0 10px rgba(232,183,83,.72));
    }
    .puzzleTarget{
      position:absolute; z-index:94; border:1px dashed rgba(232,183,83,.28);
      background:rgba(232,183,83,.025); border-radius:16px; pointer-events:none;
      transition:.25s ease;
    }
    .puzzleTarget.lit{
      border-color:rgba(245,209,130,.92); background:rgba(232,183,83,.10);
      box-shadow:0 0 24px rgba(232,183,83,.5);
    }
    #scene24PuzzleStatus{
      position:absolute; left:50%; bottom:2.5%; transform:translateX(-50%);
      z-index:120; padding:.42rem .95rem; border:1px solid rgba(232,183,83,.42);
      border-radius:999px; background:rgba(2,11,19,.62); color:#efd18b;
      font-family:Georgia,"Times New Roman",serif; font-size:clamp(12px,1.15vw,19px);
      letter-spacing:.035em; text-shadow:0 2px 8px #000; backdrop-filter:blur(3px);
      white-space:nowrap; pointer-events:none;
    }
    #scene24WrongPulse{
      position:absolute; width:90px; height:90px; border-radius:50%;
      border:3px solid rgba(255,92,118,.92); box-shadow:0 0 30px rgba(255,70,100,.65);
      transform:translate(-50%,-50%) scale(.35); opacity:0; z-index:130; pointer-events:none;
    }
    #scene24WrongPulse.play{animation:mirrorWrongPulse .55s ease forwards;}
    @keyframes mirrorWrongPulse{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
      40%{opacity:1;transform:translate(-50%,-50%) scale(.9)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}
    }

  
    /* ===== v37 mirror puzzle: pieces are real independent images, never scene-sized ===== */
    #scene24 #scene24PuzzleLayer .puzzlePiece{
      position:absolute !important;
      inset:auto !important;
      max-width:none !important;
      max-height:none !important;
      height:auto !important;
      object-fit:contain !important;
      object-position:center !important;
      pointer-events:auto !important;
      touch-action:none !important;
      user-select:none !important;
      -webkit-user-drag:none !important;
      filter:drop-shadow(0 0 10px rgba(232,183,83,.78));
      transition:left .18s ease, top .18s ease, width .18s ease, filter .18s ease;
    }
    #scene24 #scene24PuzzleLayer .puzzlePiece.dragging{
      transition:none !important;
      filter:drop-shadow(0 0 22px rgba(245,209,130,1));
    }

    #scene24:not(.active) #scene24PuzzleLayer,
    #scene24:not(.active) #scene24PuzzleLayer *{
      pointer-events:none !important;
    }
    #scene24.active #scene24PuzzleLayer{
      pointer-events:auto;
    }
    #scene24 .puzzleTarget{
      border:1px dashed rgba(232,183,83,.35) !important;
      background:rgba(232,183,83,.035) !important;
    }

  
    /* ===== v40 polished mirror puzzle ===== */
    #scene24PuzzleLayer .originCover{
      position:absolute;
      z-index:108;
      background:linear-gradient(180deg,rgba(15,24,34,.98),rgba(6,13,24,.98));
      border:1px solid rgba(198,151,72,.26);
      border-radius:12px;
      box-shadow:inset 0 0 18px rgba(0,0,0,.62);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s ease;
    }
    #scene24PuzzleLayer .originCover.show{opacity:1;}
    #scene24 #scene24PuzzleLayer .puzzlePiece{
      filter:drop-shadow(0 5px 8px rgba(0,0,0,.72)) drop-shadow(0 0 7px rgba(239,194,100,.55)) !important;
      transform-origin:center center !important;
    }
    #scene24 #scene24PuzzleLayer .puzzlePiece.dragging{

  <script>
  (() => {
    const W = 1672;
    const H = 941;

    const scenes = [...document.querySelectorAll(".scene")];
    const sceneBackdrop = document.getElementById("sceneBackdrop");
    const scene1 = document.getElementById("scene1");
    const scene2 = document.getElementById("scene2");
    const scene3 = document.getElementById("scene3");
    const scene4 = document.getElementById("scene4");
    const scene5 = document.getElementById("scene5");
    const scene6 = document.getElementById("scene6");
    const scene7 = document.getElementById("scene7");
    const scene8 = document.getElementById("scene8");
    const scene9 = document.getElementById("scene9");
    const scene10 = document.getElementById("scene10");
    const scene11 = document.getElementById("scene11");
    const scene12 = document.getElementById("scene12");
    const scene13 = document.getElementById("scene13");
    const scene14Dialogue = document.getElementById("scene14Dialogue");
    const scene14Instruction = document.getElementById("scene14Instruction");
    const scene14How = document.getElementById("scene14How");
    const scene15 = document.getElementById("scene15");
    const scene15Portal = document.getElementById("scene15Portal");
    const scene16 = document.getElementById("scene16");
    const scene17 = document.getElementById("scene17");
    const scene18 = document.getElementById("scene18");
    const scene19 = document.getElementById("scene19");
    const scene20 = document.getElementById("scene20");
    const scene21 = document.getElementById("scene21");
    const scene22 = document.getElementById("scene22");
    const scene23 = document.getElementById("scene23");
    const scene24 = document.getElementById("scene24");

    /* v39: initialize inactive scenes as inert before any mission starts. */
    scenes.forEach(s => {
      const active = s.classList.contains("active");
      s.setAttribute("aria-hidden", active ? "false" : "true");
      try{ s.inert = !active; }catch(_){ }
    });
    const scene25 = document.getElementById("scene25");
    const scene26 = document.getElementById("scene26");

    const beginStory = document.getElementById("beginStory");
    const scene2Continue = document.getElementById("scene2Continue");
    const tapPulse = document.getElementById("tapPulse");

    const reachCanvas = document.getElementById("reachCanvas");
    const ctx = reachCanvas.getContext("2d");
    const handDragStart = document.getElementById("handDragStart");
    const missionHint = document.getElementById("missionHint");
    const scene6Continue = document.getElementById("scene6Continue");
    const scene7Continue = document.getElementById("scene7Continue");
    const scene8State1 = document.getElementById("scene8State1");
    const scene8State2 = document.getElementById("scene8State2");
    const scene8State3 = document.getElementById("scene8State3");
    const scene8Gesture = document.getElementById("scene8Gesture");
    const scene8Ctx = scene8Gesture.getContext("2d");
    const scene8TapRock = document.getElementById("scene8TapRock");
    const scene8Hint = document.getElementById("scene8Hint");
    const scene9Continue = document.getElementById("scene9Continue");
    const scene10Continue = document.getElementById("scene10Continue");
    const scene11Continue = document.getElementById("scene11Continue");
    const scene12Continue = document.getElementById("scene12Continue");
    const scene13Lock = document.getElementById("scene13Lock");
    const scene14DialogueContinue = document.getElementById("scene14DialogueContinue");
    const scene14InstructionContinue = document.getElementById("scene14InstructionContinue");
    const scene14HowContinue = document.getElementById("scene14HowContinue");
    const scene15RpsChoice = document.getElementById("scene15RpsChoice");
    const scene15PaperLose = document.getElementById("scene15PaperLose");
    const scene15ScissorsTie = document.getElementById("scene15ScissorsTie");
    const scene15RockWin = document.getElementById("scene15RockWin");
    const scene15RpsButtons = document.getElementById("scene15RpsButtons");
    const scene15KeyCanvas = document.getElementById("scene15KeyCanvas");
    const scene16Continue = document.getElementById("scene16Continue");
    const scene17Continue = document.getElementById("scene17Continue");
    const scene19Continue = document.getElementById("scene19Continue");
    const alchemyIngredientButtons = [...document.querySelectorAll(".alchemyIngredient")];
    const alchemyStatus = document.getElementById("alchemyStatus");
    const alchemySlots = [
      document.getElementById("alchemySlot1"),
      document.getElementById("alchemySlot2"),
      document.getElementById("alchemySlot3")
    ];
    const scene15KeyCtx = scene15KeyCanvas.getContext("2d");
    const scene15KeyStart = document.getElementById("scene15KeyStart");
    const scene15DragHint = document.getElementById("scene15DragHint");
    const scene15PortalContinue = document.getElementById("scene15PortalContinue");
    const scene20Continue = document.getElementById("scene20Continue");
    const scene21Continue = document.getElementById("scene21Continue");
    const mirrorChoices = [...document.querySelectorAll(".mirrorChoice")];
    const scene23Retry = document.getElementById("scene23Retry");
    const puzzlePieces = [...document.querySelectorAll(".puzzlePiece")];
    const puzzleTargets = [...document.querySelectorAll(".puzzleTarget")];
    const puzzleCovers = [...document.querySelectorAll(".originCover")];
    const scene24PuzzleStatus = document.getElementById("scene24PuzzleStatus");
    const scene24WrongPulse = document.getElementById("scene24WrongPulse");
    const scene25Continue = document.getElementById("scene25Continue");
    const scene26PortalTouch = document.getElementById("scene26PortalTouch");

    /*
      Locked coordinates in the 1672 x 941 artwork.
      Nothing in the PNG is moved.
    */
    const hand = { x: 914, y: 657 };
    const bottle = { x: 1005, y: 757 };
    const bottleRadius = 105;

    let dragging = false;
    let complete = false;
    let current = { x: hand.x, y: hand.y };

    function updateSceneBackdrop(scene){
      if(!sceneBackdrop || !scene) return;
      const img = scene.querySelector("img");
      if(!img) return;

      const src = img.currentSrc || img.getAttribute("src") || "";
      if(!src) return;

      sceneBackdrop.src = src;
    }

    function showScene(next){
      scenes.forEach(s => {
        s.classList.remove("active");
        s.setAttribute("aria-hidden","true");
        try{ s.inert = true; }catch(_){ }
      });
      next.classList.add("active");
      next.setAttribute("aria-hidden","false");
      try{ next.inert = false; }catch(_){ }
      updateSceneBackdrop(next);
    }

    function pulseAt(e){
      if(typeof e.clientX !== "number") return;
      tapPulse.style.left = e.clientX + "px";
      tapPulse.style.top = e.clientY + "px";
      tapPulse.classList.remove("play");
      void tapPulse.offsetWidth;
      tapPulse.classList.add("play");
    }

    function pointInArtwork(e){
      const r = reachCanvas.getBoundingClientRect();
      return {
        x:(e.clientX-r.left) * W/r.width,
        y:(e.clientY-r.top) * H/r.height
      };
    }

    function clearLine(){
      ctx.clearRect(0,0,W,H);
    }

    function drawLine(endX,endY,success=false){
      clearLine();

      ctx.save();
      ctx.lineCap="round";
      ctx.lineJoin="round";

      /* soft glow */
      ctx.shadowColor = success
        ? "rgba(255,220,130,.98)"
        : "rgba(232,183,83,.9)";
      ctx.shadowBlur = success ? 28 : 17;

      ctx.strokeStyle = success
        ? "rgba(255,222,146,.98)"
        : "rgba(232,183,83,.92)";

      ctx.lineWidth = success ? 5 : 4;
      ctx.setLineDash(success ? [] : [12,10]);

      ctx.beginPath();
      ctx.moveTo(hand.x,hand.y);

      /*
        Slight curve makes the reach feel more elegant
        than a rigid straight line.
      */
      const mx=(hand.x+endX)/2;
      const my=(hand.y+endY)/2 - 24;
      ctx.quadraticCurveTo(mx,my,endX,endY);
      ctx.stroke();

      /* small glowing end point */
      ctx.setLineDash([]);
      ctx.fillStyle = success
        ? "rgba(255,229,166,.98)"
        : "rgba(239,196,101,.95)";
      ctx.beginPath();
      ctx.arc(endX,endY,success ? 10 : 7,0,Math.PI*2);
      ctx.fill();

      ctx.restore();
    }

    function startReach(e){
      if(complete) return;

      e.preventDefault();
      dragging=true;
      handDragStart.classList.add("dragging");

      current = pointInArtwork(e);
      drawLine(current.x,current.y);

      try{
        handDragStart.setPointerCapture(e.pointerId);
      }catch(_){}
    }

    function moveReach(e){
      if(!dragging || complete) return;

      e.preventDefault();
      current=pointInArtwork(e);
      drawLine(current.x,current.y);

      /*
        Complete immediately when the drawn line reaches the bottle.
      */
      const d=Math.hypot(current.x-bottle.x,current.y-bottle.y);

      if(d <= bottleRadius){
        completeMission();
      }
    }

    function endReach(e){
      if(!dragging || complete) return;

      e.preventDefault();
      dragging=false;
      handDragStart.classList.remove("dragging");

      const p=pointInArtwork(e);
      const d=Math.hypot(p.x-bottle.x,p.y-bottle.y);

      if(d <= bottleRadius){
        completeMission();
      }else{
        /*
          Missed the bottle:
          line disappears and user can try again.
        */
        clearLine();
      }
    }

    function completeMission(){
      if(complete) return;

      complete=true;
      dragging=false;
      handDragStart.classList.remove("dragging");
      handDragStart.style.pointerEvents="none";
      missionHint.classList.add("done");

      /*
        Snap ONLY THE LINE to the bottle.
        The bottle PNG stays 100% unchanged.
      */
      drawLine(bottle.x,bottle.y,true);

      document.dispatchEvent(
        new CustomEvent("bottleMissionComplete")
      );

      /* Show the locked MISSION COMPLETE scene after a short success beat */
      setTimeout(() => {
        showScene(scene6);
      }, 700);
    }

    handDragStart.addEventListener("pointerdown",startReach);
    handDragStart.addEventListener("pointermove",moveReach);
    handDragStart.addEventListener("pointerup",endReach);
    handDragStart.addEventListener("pointercancel",endReach);

    /*
      Existing story flow.
      Scene 3 = 3 seconds.
      Scene 4 = 3 seconds.
    */
    beginStory.addEventListener("pointerup",e=>{
      e.preventDefault();
      pulseAt(e);
      setTimeout(()=>showScene(scene2),220);
    });

    scene2Continue.addEventListener("pointerup",e=>{
      e.preventDefault();
      pulseAt(e);

      setTimeout(()=>{
        showScene(scene3);

        setTimeout(()=>{
          showScene(scene4);

          setTimeout(()=>{
            showScene(scene5);
          },3000);

        },3000);

      },260);
    });

    /* Scene 6 -> Scene 7 */
    scene6Continue.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      setTimeout(() => showScene(scene7), 260);
    });

    /* Scene 7 -> Scene 8 */
    scene7Continue.addEventListener("pointerup", e => {
      e.preventDefault();
      pulseAt(e);
      setTimeout(() => {
        showScene(scene8);
        resetScene8();
      }, 260);
    });


    /* ===== Scene 8 interaction =====
       1) Tap rock -> show grabbed state.
       2) Drag upward -> draw gold line, then show lifted state.
       3) Drag downward toward bottle -> draw gold line and complete.
    */

    let scene8Phase = 0;
    let scene8Dragging = false;
    let scene8PointerId = null;
    let scene8Start = null;

    const ART_W = 1672;
    const ART_H = 941;

    /* Coordinates in the locked artwork */
    const grabbedRock = { x:1040, y:770 };   // Scene 8.2 rock
    const liftedRock  = { x:930,  y:175 };   // Scene 8.3 raised rock
    const bottleTarget = { x:700, y:835 };   // bottle in Scene 8.3

    function setScene8State(n){
      scene8State1.classList.toggle("active8", n === 1);
      scene8State2.classList.toggle("active8", n === 2);
      scene8State3.classList.toggle("active8", n === 3);
    }

    function resetScene8(){
      scene8Phase = 0;
      scene8Dragging = false;
      scene8PointerId = null;
      scene8Start = null;
      setScene8State(1);
      scene8TapRock.style.display = "block";
      scene8Hint.textContent = "Tap the glowing rock";
      scene8Ctx.clearRect(0,0,ART_W,ART_H);
    }

    ["./scene8_1.png?v=38","./scene8_2.png?v=38","./scene8_3.png?v=38"].forEach(src => {
      const img = new Image();
      img.src = src;
    });

    function artPoint(clientX, clientY){
      const r = scene8Gesture.getBoundingClientRect();
      return {
        x:(clientX-r.left) * ART_W/r.width,
        y:(clientY-r.top) * ART_H/r.height
      };

    function drawKeyLine(p,success=false){
      clearKeyLine();
      scene15KeyCtx.save();
      scene15KeyCtx.strokeStyle=success ? "#ffe8a0" : "#f3c55d";
      scene15KeyCtx.shadowColor="#f3c55d";

      scene15KeyCtx.lineCap="round";

      scene15KeyCtx.beginPath();
      scene15KeyCtx.moveTo(scene15Key.x,scene15Key.y);
      const cx=(scene15Key.x+p.x)/2;
      const cy=Math.min(scene15Key.y,p.y)-45;
      scene15KeyCtx.quadraticCurveTo(cx,cy,p.x,p.y);
      scene15KeyCtx.stroke();

      scene15KeyCtx.beginPath();
      scene15KeyCtx.arc(p.x,p.y,success?24:15,0,Math.PI*2);

    function setOriginCover(c, show){

      if(!cover) return;
      cover.style.left=(c.x-c.w/2)+"%";
      cover.style.top=(c.y-c.h/2)+"%";

    function beginPuzzleDrag(piece,e){
      const id=Number(piece.dataset.piece);
      if(placedPuzzlePieces.has(id)) return;
      e.preventDefault(); e.stopPropagation();
      const c=cfgFor(id);
      const p=framePercentFromPointer(e.clientX,e.clientY);
      puzzleDrag={id,piece,c,startX:p.x,startY:p.y,moved:false};
      setOriginCover(c,true);
      piece.classList.add("dragging");
      piece.style.setProperty("z-index","140","important");

      const margin=3.2;
      const inside = moved && p.x >= c.tx-margin && p.x <= c.tx+c.tw+margin && p.y >= c.ty-margin && p.y <= c.ty+c.th+margin;
      const target=puzzleTargets.find(v=>Number(v.dataset.target)===id);

        target.classList.add("lit");

      piece.addEventListener("pointerdown", e => beginPuzzleDrag(piece,e), {passive:false});
    });
    window.addEventListener("pointermove", movePuzzleDrag, {passive:false});
    window.addEventListener("pointerup", endPuzzleDrag, {passive:false});
    window.addEventListener("pointercancel", () => {
      if(!puzzleDrag) return;
      setOriginCover(puzzleDrag.c,false);
      positionPieceAtOrigin(puzzleDrag.piece,puzzleDrag.c);
      puzzleDrag.piece.classList.remove("dragging");
      puzzleDrag=null;
    });

    scene25Continue.addEventListener("pointerup", e => {
      e.preventDefault(); pulseAt(e);
      setTimeout(() => showScene(scene26), 260);
    });

    scene26PortalTouch.addEventListener("pointerup", e => {
      e.preventDefault(); pulseAt(e);
      // Scene 26 is the end of the second mission for now.
    });



    const CARD_RATIO = 1672 / 941;

    function fitCardToIPhone(){
      /*
        window.innerWidth/innerHeight describe Safari's actual webpage area.
        We fit the entire 16:9 card inside it, maximizing height.
      */
      const vw = Math.max(1, window.innerWidth);
      const vh = Math.max(1, window.innerHeight);

      document.documentElement.style.setProperty("--phone-vw", vw + "px");
      document.documentElement.style.setProperty("--phone-vh", vh + "px");

      let w, h;

      if((vw / vh) > CARD_RATIO){
        // Extra-wide Safari landscape: fill height, leave side areas.
        h = vh;
        w = h * CARD_RATIO;
      }else{
        // Narrower viewport: fill width.
        w = vw;
        h = w / CARD_RATIO;
      }

      // 2 px breathing room so the gold frame is never clipped.
      w = Math.max(1, w - 2);
      h = Math.max(1, h - 2);

      document.documentElement.style.setProperty("--fit-w", Math.floor(w) + "px");
      document.documentElement.style.setProperty("--fit-h", Math.floor(h) + "px");
    }

    function refitCard(){
      fitCardToIPhone();
      requestAnimationFrame(fitCardToIPhone);
      setTimeout(fitCardToIPhone, 80);
      setTimeout(fitCardToIPhone, 250);
      setTimeout(fitCardToIPhone, 600);
    }

    window.addEventListener("load", () => {
      refitCard();
      /* Always start from Scene 1. Never resume at Scene 14/15. */
      showScene(scene1);
      updateSceneBackdrop(scene1);
    }, {once:true});

    window.addEventListener("resize", refitCard, {passive:true});
    window.addEventListener("orientationchange", refitCard, {passive:true});

  })();
  </script>
